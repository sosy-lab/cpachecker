format_version: '2.1'

additional_information:
  task_type: validation
  verification:
    - property_file: ../../../config/properties/no-data-race.prp
      expected_verdict: false

input_files:
  - 'concurrent-data-race.c'
  - 'concurrent-data-race.avoid-creation.witness-2.2.yml'

properties:
  # The avoid waypoint excludes a thread creation the program always performs,
  # so the witness describes no execution and must be rejected.
  - property_file: ../../../config/properties/no-data-race.prp
    expected_verdict: true

options:
  language: C
  data_model: ILP32
  witness_input_file: 'concurrent-data-race.avoid-creation.witness-2.2.yml'
