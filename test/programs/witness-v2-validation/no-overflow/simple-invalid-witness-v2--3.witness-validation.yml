format_version: '2.1'

additional_information:
  task_type: validation
  verification:
    - property_file: ../../../config/properties/no-overflow.prp
      expected_verdict: true

input_files:
  - 'simple.c'
  - 'simple-invalid-witness-v2--3.yml'

properties:
  # The invariant is not inductive, so the witness must be rejected.
  - property_file: ../../../config/properties/no-overflow.prp
    expected_verdict: false

options:
  language: C
  data_model: ILP32
  witness_input_file: 'simple-invalid-witness-v2--3.yml'
