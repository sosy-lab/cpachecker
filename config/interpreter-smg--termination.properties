# ----------------------------------------------------------------------
# Like interpreter--termination.properties, but with the SMG analysis,
# which is precise for programs that access memory through pointers.
# ----------------------------------------------------------------------

#include includes/interpreter-smg.properties
#include includes/resource-limits.properties

CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.smg2.SMGCPA, cpa.automaton.ControlAutomatonCPA TerminatingFunctionsAutomaton

specification =
termination.config = interpreter-smg--termination.properties

cpa.interpreter.maxAssignmentsPerLocation = 0

# Every execution has to terminate, also those in which an allocation fails.
# InterpreterCPA executes both outcomes of each allocation.
cpa.smg2.enableMallocFail = true
cpa.smg2.enableCallocFail = true
cpa.smg2.enableReallocFail = true

# A call of an unknown function may have side effects that the SMG analysis ignores.
# The safe functions are those that the value analysis ignores, too.
cpa.smg2.handleUnknownFunctions = STRICT
cpa.smg2.safeUnknownFunctions = printf, puts, srand, abort, exit, __builtin_unreachable, __assert_fail

[TerminatingFunctionsAutomaton]
cpa.automaton.inputFile = specification/TerminatingFunctions.spc
