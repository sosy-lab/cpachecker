// ----------------------------------------------------------------------
// k-induction with the coverage and merge criteria of the induction step case
// relaxed, so that its state-space exploration can actually be collapsed
// (cf. #1694).
//
// Without the relaxation the step case does not even finish unrolling for
// k = 1 on some tasks: in BMC mode merge^JOIN is the only mechanism that can
// collapse states at all (the predicate domain covers a state only if the path
// formulas are identical), merge is only ever attempted between states of the
// same reached-set partition, and the partition key distinguishes practically
// every state, because CallstackState is compared by object identity by design
// and LoopBoundState carries the whole per-loop iteration vector.
//
// The relaxation applies to the step case only, via bmc.stepCaseConfig. It must
// not be put here directly: these options would then also apply to the BMC base
// case, which under-approximates by its loop bound and loses reachable states
// when its coverage is coarsened. Doing so makes the base case report a wrong
// TRUE on, for example, bitvector-loops/verisec_sendmail_tTflag_arr_one_loop.c.
//
// Only use this where k-induction runs on its own and no invariants are
// supplied to it, i.e. for the plain configurations. Do not use it in a
// parallel portfolio, for witness validation, or with
// bmc.invariantGenerationStrategy=INDUCTION: candidate invariants that are
// attached to a specific program location are checked with
// BMCHelper.filterBmcCheckedWithin, which reads back the per-loop iteration
// counts of individual states, and those are no longer meaningful once states
// with different counts cover each other.
// ----------------------------------------------------------------------

#include kInduction.properties

// Relax coverage and merging in the induction step case only.
bmc.stepCaseConfig = step-case-relaxed.properties

// With the relaxation the bottleneck of the step case is no longer the
// state-space exploration but the SMT induction check, so simplify the formulas
// handed to the solver. This is sound for the whole analysis.
bmc.simplifyBooleanFormula = true

// Grow the loop-unrolling bound along the Fibonacci sequence (1, 2, 3, 5, 8,
// ...): faster than incrementing, but without skipping as many bounds as
// doubling does. This is only a different deepening schedule, so it is sound
// for the whole analysis.
//
// Note that skipping bounds can make bug finding slower, because the smallest
// bound that exposes a bug may be skipped and the next one is much more
// expensive. On loops/insertion_sort-1-2.c, for example, the violation is found
// at bound 9 with INCREMENT but only at bound 13 with FIBONACCI, which takes
// 220s instead of less than 90s. Set this option to INCREMENT if finding
// violations quickly matters more than reaching a high bound.
cpa.loopbound.maxLoopIterationAdjusterFactory = FIBONACCI
