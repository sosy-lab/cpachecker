// ----------------------------------------------------------------------
// Options for the induction step case of k-induction, loaded via
// bmc.stepCaseConfig. They must not be put into the configuration of the
// analysis, because they would then also apply to the BMC base case (cf. #1694).
//
// The step case starts from an arbitrary state at each loop head, so it may
// freely over-approximate: a coarser exploration can only make the induction
// check harder to discharge, never wrong. The base case is the opposite: it
// under-approximates by its loop bound, and coarsening its coverage makes it
// lose reachable states. Applying the options below to the whole analysis makes
// the base case report a wrong TRUE on, for example,
// bitvector-loops/verisec_sendmail_tTflag_arr_one_loop.c, because the error
// state is covered away and never reached.
//
// Without these options the step case does not even finish unrolling for k = 1
// on some tasks: in BMC mode merge^JOIN is the only mechanism that can collapse
// states at all (the predicate domain covers a state only if the path formulas
// are identical), merge is only ever attempted between states of the same
// reached-set partition, and the partition key distinguishes practically every
// state, because CallstackState is compared by object identity by design and
// LoopBoundState carries the whole per-loop iteration vector.
// ----------------------------------------------------------------------

// Partition the reached set by location, call chain and deepest loop iteration
// instead of by every Partitionable component, so that merge^JOIN is attempted
// at all. Partitioning by location alone also enables merging, but makes every
// merge scan all states at that location, which measures worse than doing
// nothing.
analysis.reachedSet = INDUCTIONPARTITIONED

// Compare call stacks by proof state instead of by object identity, so that two
// invocations of the same function can cover each other.
cpa.callstack.domain = FLATPCC

// Compare only the deepest loop iteration instead of the whole per-loop
// iteration vector, so that states that merely visited a different set of loops
// can cover each other.
cpa.loopbound.domain = DEEPEST_ITERATION
