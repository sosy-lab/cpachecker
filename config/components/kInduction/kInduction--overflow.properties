// ----------------------------------------------------------------------
// This configuration file enables k-induction for checking for overflows.
// ----------------------------------------------------------------------

#include kInduction.properties
#include ../../includes/overflow.properties

// Add cpa.overflow.OverflowCPA, which turns overflowing operations into target states.
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA, cpa.overflow.OverflowCPA, cpa.assumptions.storage.AssumptionStorageCPA, cpa.loopbound.LoopBoundCPA, cpa.value.ValueAnalysisCPA, cpa.pointer2.PointerCPA, cpa.input.InputCPA

# Variables classified as irrelevant might be in fact relevant,
# because the added overflow assumptions lead to branching based on them:
cpa.predicate.ignoreIrrelevantVariables = false
