# ************** SV-COMP'27 specifics ***********************

# Bounded ordering-consistency analysis as a parallel component for concurrent programs
# (no-overflow).

#include ../orderingConsistency--overflow.properties

# chosen by simulating the portfolio on the no-overflow tasks of Concurrency.set
limits.time.cpu.thread = 240s

oc.encoding = CLOCKS

# No YAML violation witnesses for overflows in concurrent programs exist currently
counterexample.export.yaml =
cpa.arg.yamlProofWitness = witness.yml
