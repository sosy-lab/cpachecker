# ************** SV-COMP'27 ***********************
# Bitwuzla finds some interpolants that MathSAT5 does not find, and is faster in some cases

#include svcomp27--singleLoop-IMC.properties

limits.time.cpu = 180s

solver.solver = BITWUZLA
# Bitwuzla does not support the theory of Integers
cpa.predicate.encodeIntegerAs=BITVECTOR
