# -----------------------------------------------------------------------------
# This configuration file validates violation witnesses for the overflow
# property of multi-threaded programs with bit-precise predicate analysis.
# -----------------------------------------------------------------------------

#include ../includes/predicateAnalysis-concurrency-witness-validation.properties
#include ../includes/predicateAnalysis--overflow.properties

# the included configurations both define the CPAs, so combine them here
CompositeCPA.cpas = cpa.threading.ThreadingCPA, cpa.predicate.PredicateCPA, cpa.overflow.OverflowCPA

# We need to consider all possible interleavings for validation
cpa.threading.stopStateSpaceExplorationOnMainExit = false

# ThreadingCPA needs to take all names of function clones into account
# to match any possible function from the witness automaton
cpa.threading.useAllPossibleClones = true

# a pthread_t variable may be reused for a second thread
cpa.threading.allowMultipleLHS = true

# Disable CPU time limit
limits.time.cpu =
