#include concurrency-sequentialization-uc-por.properties

# The analyses of the sequentialized program, with time limits for the concurrency portfolio.
analysis.useParallelAnalyses = true
parallelAlgorithm.configFiles = svcomp27--concurrency-sequentialization-predicateAnalysis.properties, \
                                svcomp27--concurrency-sequentialization-kInduction.properties

# Disable CPU time limit
limits.time.cpu =

# Disable redundant parsing of the sequentialization, because it is parsed anyway for the analysis.
# Parsing can take several seconds, so it should be optimized for the svcomp27 configs.
analysis.algorithm.MPOR.validateParse = false

# 'strcpy' resulted in false alarms for multiple concurrent reachability tasks.
# The other unsupported functions are copied from 'svcomp27.properties'
cpa.callstack.unsupportedFunctions=strcpy,pthread_create,pthread_once,pthread_barrier_wait,pthread_key_create,sin,cos,_longjmp,longjmp,siglongjmp,atexit
