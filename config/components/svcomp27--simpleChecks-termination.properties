# ----------------------------------------------------------------------
# The simple checks that run next to the analyses of svcomp27--termination.properties.
# Cf. svcomp27--simpleChecks.properties.
# ----------------------------------------------------------------------

#include svcomp27--simpleChecks.properties

# The termination variants of the two analyses. Both decide termination on their own:
# the rules argue about the loops of the program, and the execution terminates if and
# only if the program does. Neither of them is a safety analysis that the termination
# algorithm could use, so we have to switch that algorithm off here.
analysis.algorithm.termination = false

parallelAlgorithm.configFiles = ../simpleRules--termination.properties, \
                                ../interpreter--termination.properties
