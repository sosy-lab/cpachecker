#include ../includes/predicateAnalysis-PredAbsRefiner-ABEl.properties

# ************** SV-COMP'27 specifics ***********************

limits.time.cpu.thread = 200s

CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA, cpa.pointer2.PointerCPA

cpa.callstack.skipVoidRecursion = true

# 'strcpy' resulted in false alarms for multiple concurrent reachability tasks (via sequentialization).
# The other functions are copied from `config/default.properties`.
cpa.callstack.unsupportedFunctions=strcpy,pthread_create,pthread_key_create,sin,cos,__builtin_uaddl_overflow,_longjmp,longjmp,siglongjmp,atexit
