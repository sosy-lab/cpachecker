# ************** SV-COMP'27 specifics ***********************

# Bounded ordering-consistency analysis as a parallel component for concurrent programs
# (unreach-call).

#include ../orderingConsistency.properties

# OC rarely gains anything after its cutoff; free the CPU for the other parallel components
limits.time.cpu.thread = 90s

# the default solver (MathSAT, bitvectors) performed best for unreach-call in the 60 s benchmarks

oc.encoding = CLOCKS

# YAML witnesses configuration options
counterexample.export.yaml = witness.yml
cpa.arg.yamlProofWitness = witness.yml
