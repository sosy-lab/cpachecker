# -----------------------------------------------------------------------------
# This configuration file checks the supporting invariants of a termination
# witness by converting the witness automaton into an ISA that marks invariant
# violations as error states.
# -----------------------------------------------------------------------------

#include ../includes/isa-correctness-witness.properties

# Use sequential combination of analyses.
analysis.restartAfterUnknown = true

# The analyses used for checking the invariants.
restartAlgorithm.configFiles = ../predicateAnalysis.properties, ../predicateAnalysis-bam-rec.properties::if-recursive

# The invariants may refer to variables that are irrelevant for the program itself.
cpa.predicate.ignoreIrrelevantVariables = false

output.disable = true
