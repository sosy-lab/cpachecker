#include ../includes/predicateAnalysis-PredAbsRefiner-ABEl.properties

# Use linear approximation, as in predicateAnalysis-linear.properties. That file is not included,
# because it enables the counterexample check, which cannot handle the target state of a rejected
# witness (it is not in the ARG).
cpa.predicate.encodeBitvectorAs = INTEGER
cpa.predicate.encodeFloatAs = RATIONAL
cpa.predicate.handleFieldAccess = false

# Override list of CPAs to add one automaton that TerminationAlgorithm needs,
# and another that implements C functions like exit().
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA

analysis.algorithm.terminationWitnessCheck=true
termination.validation.checkWithInfiniteSpace=false

# Disable CPU time limit
limits.time.cpu =

# We need a solver that supports quantifiers
solver.solver=z3
