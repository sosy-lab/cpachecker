# -----------------------------------------------------------------------------
# This configuration file validates violation witnesses for multi-threaded
# programs with bit-precise predicate analysis and value analysis.
# -----------------------------------------------------------------------------

#include ../includes/predicateAnalysis-concurrency-witness-validation.properties

# Value analysis cuts branches and witness constraints over concrete values
# immediately, which predicate analysis without abstractions only does at the target
CompositeCPA.cpas = cpa.threading.ThreadingCPA, cpa.predicate.PredicateCPA, cpa.value.ValueAnalysisCPA
cpa.value.merge = JOIN

# We need to consider all possible interleavings for validation
cpa.threading.stopStateSpaceExplorationOnMainExit = false

# ThreadingCPA needs to take all names of function clones into account
# to match any possible function from the witness automaton
cpa.threading.useAllPossibleClones = true

# Disable CPU time limit
limits.time.cpu =

# Disable specification
specification =
