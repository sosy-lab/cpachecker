# ----------------------------------------------------------------------
# The main analysis for reachability properties in SV-COMP'27: a
# heuristic picks the sequence of analyses that fits the program.
# This is a component of svcomp27.properties, which runs it next to
# the simple checks.
# ----------------------------------------------------------------------

# Use heuristic selection of algorithms
analysis.selectAnalysisHeuristically = true

# Threshold for addressedConfig (double) in [0..1]
heuristicSelection.addressedRatio = 0.0

# The paths of the analyses are relative to this file, i.e., to config/components/.

# The standard analysis used for loop-free programs
heuristicSelection.loopFreeConfig = svcomp27--configselection-restart-bmc-fallbacks.properties

# The standard analysis used for programs with a single loop
heuristicSelection.singleLoopConfig = svcomp27--singleLoopConfig.properties

# The standard analysis used for programs with multiple loops
heuristicSelection.loopConfig = svcomp27--multipleLoopsConfig.properties

# The analysis used for programs with loops and complex datastructures
heuristicSelection.complexLoopConfig = svcomp27--configselection-restart-valueAnalysis-fallbacks.properties
