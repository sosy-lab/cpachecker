// ----------------------------------------------------------------------------
// Check for overflows with bit-accurate k-induction in combination with a
// continuously-refined invariant generator using a data-flow analysis over an
// interval-based abstract domain. Both analyses use the OverflowCPA, which
// splits every potentially overflowing operation into a state where the
// operation overflows and one where it does not.
// ----------------------------------------------------------------------------

#include ../../includes/overflow.properties

analysis.useParallelAnalyses=true

// KNOWN UNSOUNDNESS -- please turn this into an issue before relying on this
// config. On unbounded or nonlinear-arithmetic loops it wrongly reports TRUE,
// although each of its two analyses alone answers UNKNOWN. Measured 2026-09-13
// over the 73 nla-digbench/termination-crafted tasks whose no-overflow verdict
// is false: 5 wrong TRUE (nla-digbench ps2, ps3, sqrt1, termination-crafted
// NonTermination4, easy2-1).
//
// The cause is in ParallelAlgorithm.runParallelAnalysis, not in either analysis.
// Its refinable branch guards publishing the reached set with status.isSound()
// alone, while claiming safety a few lines above additionally requires
//   !from(currentReached).anyMatch(or(isTargetState, hasAssumptions))
// A reached set whose branches stop at a target state is therefore published,
// and FormulaInvariantsSupplier turns it into a location invariant (the
// disjunction of the states at a node, false if the node has none). Everything
// reachable past those targets is missing, so the invariant is far too strong.
//
// For termination-crafted/NonTermination4, x=1,y=1; while(x>=0){x=2*x;y=3*y;},
// the published reached set is a fixpoint (isSound=true, isPrecise=false, no
// waiting states) that contains the overflow target states, and the invariant it
// yields at the loop head is x in {1,2} -- with which k-induction proves that
// 2*x never overflows.
//
// Plain ::supply-reached avoids this only by accident: it additionally requires
// status.isPrecise(), which InvariantsCPA never reports, so it publishes nothing
// and the 5 tasks above come out UNKNOWN. The gap is not specific to the
// overflow property either; kInduction-dfInvariants.properties, included by
// config/kInduction.properties, uses the same annotation. Until it is fixed the
// portfolio only uses dataFlowAnalysis-overflow--parallel.properties, which is
// sound on its own, just less precise.
parallelAlgorithm.configFiles = ../kInduction/kInduction--overflow.properties, ../invariantGeneration-no-out--overflow.properties::supply-reached-refinable

cpa.invariants.maximumFormulaDepth = 1
cpa.invariants.interestingVariableLimit = 0
cpa.invariants.abstractionStateFactory = ENTERING_EDGES

// This option is really useful for BMC and all the BMC-based analyses (cf. #1713).
// In theory it is unsound for really special specifications,
// but k-induction had this implemented internally for years as well.
cfa.removeTrivialLoops = true
