// ----------------------------------------------------------------------------
// Check for overflows with bit-accurate k-induction in combination with a
// continuously-refined invariant generator using a data-flow analysis over an
// interval-based abstract domain. Both analyses use the OverflowCPA, which
// splits every potentially overflowing operation into a state where the
// operation overflows and one where it does not.
// ----------------------------------------------------------------------------

#include ../../includes/overflow.properties

analysis.useParallelAnalyses=true

// KNOWN UNSOUNDNESS (found while wiring OverflowCPA into this combination): on
// unbounded/nonlinear-arithmetic loops (e.g. nla-digbench, termination-crafted),
// this config can wrongly report TRUE, where the data-flow analysis alone (no
// k-induction) correctly times out instead. supply-reached-refinable publishes
// the data-flow analysis's reached set after every precision-adjustment round,
// gated only on that round being "sound" -- which for an unbounded loop just
// means "consistent with what has been explored so far", not "a converged,
// genuinely inductive invariant". k-induction's own induction step then
// apparently accepts a not-yet-valid candidate from that reached set without
// separately re-proving it is itself inductive, so a false candidate can make
// an otherwise-sound induction step succeed. This looks like a pre-existing gap
// in how ParallelAlgorithm's supply-reached(-refinable) mechanism interacts
// with BMC/k-induction's invariant consumption in general, not something
// specific to the overflow property, and needs its own investigation before
// this config can be trusted; see the discussion around introducing
// dataFlowAnalysis-overflow--parallel.properties into the general portfolio
// instead (sound on its own, just less precise).
parallelAlgorithm.configFiles = ../kInduction/kInduction--overflow.properties, ../invariantGeneration-no-out--overflow.properties::supply-reached-refinable

cpa.invariants.maximumFormulaDepth = 1
cpa.invariants.interestingVariableLimit = 0
cpa.invariants.abstractionStateFactory = ENTERING_EDGES

// This option is really useful for BMC and all the BMC-based analyses (cf. #1713).
// In theory it is unsound for really special specifications,
// but k-induction had this implemented internally for years as well.
cfa.removeTrivialLoops = true
