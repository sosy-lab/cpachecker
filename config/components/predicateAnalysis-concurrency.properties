# ----------------------------------------------------------------------
# This configuration file uses the Adjustable-Block Encoding CPA
# for predicate analysis with CEGAR as described in
# "Predicate Abstraction with Adjustable-Block Encoding" (Beyer et.al.).
# Verifying Multi-Threaded Programs.
# ----------------------------------------------------------------------

#include ../includes/predicateAnalysis-PredAbsRefiner-ABEl.properties

#include ../includes/concurrency.properties

analysis.algorithm.CEGAR = true

CompositeCPA.cpas = cpa.threading.ThreadingCPA, cpa.value.ValueAnalysisCPA, cpa.predicate.PredicateCPA

analysis.traversal.order = bfs

# none of the following ordering brings a benefit for a larger set of programs
analysis.traversal.useReversePostorder = false
analysis.traversal.useCallstack        = false
analysis.traversal.useNumberOfThreads  = false

# instead of precise conditional branching points, we have thread interleavings.
counterexample.export.allowImpreciseCounterexamples = true

# Predicate analysis ignores the effect of strcpy, which leads to false alarms,
# e.g., for pthread/bigshot_s.
cpa.callstack.unsupportedFunctions=strcpy

# Counterexamples of thread interleavings can be imprecise, so we confirm them.
analysis.checkCounterexamples=true
counterexample.checker=CPAchecker
counterexample.checker.config=../cex-checks/predicateAnalysis-concurrency-as-cex-check.properties
# The default format (all ARG paths to the error state) rejects feasible counterexamples,
# e.g., for ldv-races/race-1_2-join.
counterexample.checker.counterexampleFormat = WITNESSV2
