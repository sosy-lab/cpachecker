# ************** SV-COMP'27 specifics ***********************

# The analyses used for reachability properties of concurrent programs: first the time-limited
# ordering-consistency analysis, then the parallel combination of the native concurrency analysis
# and the sequential analysis on the sequentialized program.
analysis.restartAfterUnknown = true
restartAlgorithm.configFiles = svcomp27--concurrency-orderingConsistency.properties, \
                               svcomp27--concurrency-parallel.properties
