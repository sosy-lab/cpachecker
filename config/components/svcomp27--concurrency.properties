# ************** SV-COMP'27 specifics ***********************

analysis.useParallelAnalyses=true

# YAML witnesses configuration options
counterexample.export.yaml = witness.yml
cpa.arg.yamlProofWitness = witness.yml

# The analyses used for reachability properties. It is a parallel config of the
# ordering-consistency analysis, the native predicate analysis, predicate analysis with
# partial-order reduction, and the sequential analyses run on the sequentialized program.
# The thread time limits of the members were chosen by simulating the portfolio with standalone
# runs of the members on the unreach-call tasks of Concurrency.set (issue 1822).
parallelAlgorithm.configFiles = svcomp27--concurrency-orderingConsistency.properties, \
                                svcomp27--concurrency-predicateAnalysis.properties, \
                                svcomp27--concurrency-predicateAnalysis-POR.properties, \
                                svcomp27--concurrency-sequentialization.properties
