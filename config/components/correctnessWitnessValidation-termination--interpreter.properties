# ----------------------------------------------------------------------
# Validate a termination witness by executing the program. The automaton
# of the witness checks its loop and location invariants in the concrete
# states of the execution. InterpreterCPA gives up on a witness with
# transition invariants.
# ----------------------------------------------------------------------

#include interpreter-value-then-smg--termination.properties

# The validation builds the automaton of the witness such that it only assumes the
# invariants, which would end the execution at a wrong invariant.
analysis.reparseSpecification = true
witness.checkInvariantsHoldForEveryPath = true
