# ----------------------------------------------------------------------
# Validate a termination witness by executing the program. The automaton
# of the witness checks its loop and location invariants on the way.
# ----------------------------------------------------------------------

analysis.algorithm.terminationWitnessCheckByExecution = true
termination.validation.executionConfig = interpreter-value-then-smg--termination.properties
