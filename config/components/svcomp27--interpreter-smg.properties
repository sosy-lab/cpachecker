# ----------------------------------------------------------------------
# A short execution of the program with the SMG analysis that runs
# next to the other analyses of a parallel portfolio of SV-COMP'27. Unlike the
# execution with the value analysis (../interpreter.properties), it
# handles programs that access memory through pointers, e.g., the
# hash tables of uthash. It stops early with an unknown result at the
# first nondeterministic choice, and after 30s at the latest.
# ----------------------------------------------------------------------

#include ../interpreter-smg.properties

limits.time.cpu.thread = 30s
