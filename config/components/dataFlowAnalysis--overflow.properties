// Data-flow analysis for the overflow property.
// The OverflowCPA splits every potentially overflowing operation into a state
// where the operation overflows and one where it does not. The data-flow
// analysis prunes the infeasible ones in its strengthen operator and uses the
// assumptions of the remaining ones to refine its abstract state.

#include dataFlowAnalysis.properties
#include ../includes/overflow.properties

// Add cpa.overflow.OverflowCPA, which provides the assumptions about (non-)overflowing
// operations that the data-flow analysis consumes in its strengthen operator.
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.invariants.InvariantsCPA, cpa.overflow.OverflowCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.pointer2.PointerCPA

// The relevant variables are collected from the assume edges that lead to a target location.
// Overflows are not reached via assume edges, so this leaves nothing to analyze:
// every variable is relevant for this property.
cpa.invariants.analyzeRelevantVariablesOnly = false
