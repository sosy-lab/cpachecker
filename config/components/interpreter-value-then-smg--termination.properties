# ----------------------------------------------------------------------
# Execute the program to prove termination: first with the fast value
# analysis, and if that stops (e.g., at a pointer or an allocation),
# with the slower SMG analysis.
# ----------------------------------------------------------------------

analysis.restartAfterUnknown = true

restartAlgorithm.configFiles = ../interpreter--termination.properties, \
                               ../interpreter-smg--termination.properties

specification =
