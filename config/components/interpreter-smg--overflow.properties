# ----------------------------------------------------------------------
# A short execution of the program with the SMG analysis that checks
# for overflows next to the other analyses of a parallel portfolio.
# Unlike the execution with the value analysis
# (../interpreter--overflow.properties), it handles programs that access
# memory through pointers. It stops early with an unknown result at the
# first nondeterministic choice, and after 30s at the latest.
# ----------------------------------------------------------------------

#include ../interpreter-smg--overflow.properties

limits.time.cpu.thread = 30s
