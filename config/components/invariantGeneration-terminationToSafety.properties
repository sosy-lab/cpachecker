# ----------------------------------------------------------------------
# Predicate abstraction with fixed predicates and without refinement,
# which generates the loop invariants that the termination-to-safety
# analysis uses as supporting invariants.
# ----------------------------------------------------------------------

#include invariantGeneration-no-out.properties

CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.predicate.PredicateCPA

cpa.predicate.abstraction.initialPredicatesFromLoops = true
cpa.predicate.abstraction.cartesian = true
cpa.predicate.ignoreIrrelevantVariables = false
cpa.predicate.enableMemoryAssignmentFunctions = true

# The termination-to-safety analysis uses the invariants in its formulas,
# so they need the same encoding.
cpa.predicate.encodeBitvectorAs = INTEGER
cpa.predicate.encodeFloatAs = RATIONAL
cpa.predicate.approximateBitwiseOperationsLinearly = true

# The invariants have to hold also if a value wraps around.
cpa.predicate.encodeOverflowsWithUFs = true
# Overflows of signed arithmetic are undefined behavior,
# so the termination analysis does not consider them either.
cpa.predicate.ignoreUndefinedOverflows = true

# Uninterpreted functions for nonlinear arithmetic keep the abstraction cheap.
solver.nonLinearArithmetic = APPROXIMATE_ALWAYS
