# ************** SV-COMP'27 specifics ***********************

# Predicate analysis with abstraction-aware partial-order reduction as a parallel component for
# concurrent programs (no-overflow).

#include ../predicateAnalysis-POR--overflow.properties

cpa.predicate.memoryAllocationsAlwaysSucceed = true

# abstraction-aware POR: abstract at every block, so that the reduction can use the abstraction
cpa.concurrent.abstractionAware = true
cpa.predicate.blk.threshold = 1
