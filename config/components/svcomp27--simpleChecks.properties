# ----------------------------------------------------------------------
# Two cheap analyses that run next to the main analyses of SV-COMP'27:
# the simple rules decide a task by looking at the CFA only, and the
# concrete execution decides every task whose program reads no input.
# Both answer UNKNOWN whenever they cannot decide the task, which does
# not stop the surrounding portfolio, so nothing is lost by running
# them. Cf. simpleChecks.properties, which is the same portfolio as a
# standalone configuration.
# ----------------------------------------------------------------------

# Run the two simple analyses concurrently and take the first conclusive result.
analysis.useParallelAnalyses = true

# The budget of each of the two analyses. It is a limit per thread, and the parallel
# algorithm runs every analysis in a thread of its own, so each of them gets 20s of CPU
# time while the main analyses keep running. Neither of them profits from more: the rules
# only traverse the CFA, and an execution that does not end within seconds usually never
# ends.
limits.time.cpu.thread = 20s

# The two analyses. The paths are relative to this file, i.e., to config/components/.
parallelAlgorithm.configFiles = ../simpleRules.properties, \
                                ../interpreter.properties
