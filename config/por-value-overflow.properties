# Overflow analysis for concurrent programs: por-value-cegar.properties with the OverflowCPA and
# the no-overflow specification.

#include por-value-cegar.properties
#include includes/overflow.properties

specification = specification/overflow.spc
overflow.config = por-value-overflow.properties
# PointerCPA: needed for soundness of writes through pointers.
CompositeCPA.cpas = cpa.mutex.MutexCPA, cpa.value.ValueAnalysisCPA, cpa.pointer2.PointerCPA, cpa.overflow.OverflowCPA
counterexample.checker.config = cex-checks/por-predicateAnalysis-as-cex-check-overflows.properties
