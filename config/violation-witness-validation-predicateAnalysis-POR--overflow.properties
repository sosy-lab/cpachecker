# Violation-witness validation of no-overflow witnesses for concurrent programs, based on
# predicateAnalysis-POR--overflow.properties with partial-order reduction and block aggregation
# disabled.

#include predicateAnalysis-POR--overflow.properties
#include includes/witness-validation.properties

# A waypoint matches a single statement, so POR's block aggregation must be off here.
cpa.concurrent.aggregateBasicBlocks = false

# POR keeps one interleaving per equivalence class, which is only sound while nothing else
# restricts the paths; the witness does, so its interleaving is the one POR may drop.
cpa.concurrent.partialOrderReductionAlgorithm = NOPOR

overflow.config = violation-witness-validation-predicateAnalysis-POR--overflow.properties

witness.validation.violation.config = violation-witness-validation-predicateAnalysis-POR--overflow.properties
