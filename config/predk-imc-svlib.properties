# ----------------------------------------------------------------------
# IMC as an instance of the PredK framework: every visit of a loop head
# abstracts with one predicate, the disjunction of the interpolants
# learned so far, and a loop closes when an abstraction is covered by the
# one before it. If no abstraction of a spurious counterexample can be
# widened, k increases and the predicates start over. As native IMC, the
# refiner falls back to BMC for more than one loop head.
# Compare with imc-svlib.
# ----------------------------------------------------------------------

#include includes/predk-framework-svlib.properties

cegar.refiner = cpa.induction.refiner.ImcRefiner

cpa.induction.k = 0
cpa.automaton.breakOnTargetState = 0

# interpolation and exploration as in native IMC
cpa.predicate.refinement.sequentialStrategy = BWD_FALLBACK
cpa.predicate.refinement.incrementalCexTraceCheck = false
cpa.predicate.refinement.reuseInterpolationEnvironment = true
cpa.predicate.refinement.cexTraceCheckDirection = BACKWARDS
cpa.predicate.refinement.tryWithoutInterpolation = false
analysis.traversal.useReverseLoopIterationCount = true
cpa.arg.lateMerge = prevent

specification = specification/correct-annotations.spc

# The simulation above matches native IMC. The optimizations beyond it,
# all enabled in predk-imc-optimized-svlib:
# cpa.induction.refinement.imc.bmcFallback = false
#   applies IMC to programs with several loop heads, for which native IMC
#   falls back to BMC
