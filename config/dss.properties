# Single-run DSS with the available analysis optimizations enabled.
#include distributed-summary-synthesis/dss-base.properties
#include includes/resource-limits.properties
specification=specification/default.spc

distributedSummaries.decomposition.decompositionType=INLINING_DECOMPOSITION
distributedSummaries.resetCallstackState=true
distributedSummaries.abstractAtBlockEntry=true
distributedSummaries.combineStates=true
distributedSummaries.sharePrecision=true
distributedSummaries.cacheViolationConditions=true
distributedSummaries.compressMessages=true
distributedSummaries.combineVcsByHash=true
distributedSummaries.blockAnalysisType=ALWAYS_REPLACE
distributedSummaries.syntacticVcEquality=true
distributedSummaries.worker.forwardConfiguration=distributed-summary-synthesis/dss-block-analysis-predicate.properties
distributedSummaries.decomposition.largestHorizontalMerge=-1
distributedSummaries.decomposition.mergeBranchBoundaries=true

# Preserve DSS's decomposition policy independently of witness reconstruction.
[distributedSummaries.decomposition.cpa.predicate.blk]
alwaysAtJoin=true
alwaysAtBranch=true
alwaysAtProgramExit=true
alwaysAtLoops=false
alwaysAtFunctions=false
alwaysAfterThreshold=false
alwaysAtFunctionHeads=true
alwaysAtFunctionCallNodes=false
alwaysAtFunctionExit=true

# Reconstruct a violation with ordinary predicate abstraction boundaries.
[cpa.predicate.blk]
alwaysAtJoin=false
alwaysAtBranch=false
alwaysAtProgramExit=false
alwaysAtLoops=true
alwaysAtFunctions=true
alwaysAfterThreshold=true
alwaysAtFunctionHeads=false
alwaysAtFunctionCallNodes=false
alwaysAtFunctionExit=false
