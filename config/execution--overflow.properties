# ----------------------------------------------------------------------
# This configuration file executes a program and checks whether the
# execution has a signed-integer overflow.
# It is applicable only to programs without nondeterministic choices.
# ----------------------------------------------------------------------

#include includes/execution.properties
#include includes/overflow.properties
#include includes/resource-limits.properties

# The OverflowCPA adds the assumptions that describe an overflow, which the
# value analysis then evaluates for the concrete values of the execution.
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.value.ValueAnalysisCPA, cpa.overflow.OverflowCPA, $specification

# This is the configuration used when verifying the overflow property.
overflow.config = execution--overflow.properties

specification = specification/overflow.spc
