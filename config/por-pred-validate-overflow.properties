#include por-pred-overflow.properties
#include includes/witness-validation.properties

# A waypoint matches a single statement, so POR's block aggregation must be off here.
cpa.concurrent.aggregateBasicBlocks = false

# The witness resolves its waypoints against the unmodified CFA, not POR's per-thread clones.
cpa.concurrent.matchAutomataOnOriginalEdges = true

# POR keeps one interleaving per equivalence class, which is only sound while nothing else
# restricts the paths; the witness does, so its interleaving is the one POR may drop.
cpa.concurrent.partialOrderReductionAlgorithm = NOPOR

overflow.config = por-pred-validate-overflow.properties

witness.validation.violation.config = por-pred-validate-overflow.properties
