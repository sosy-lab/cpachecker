# ----------------------------------------------------------------------
# This configuration file executes a program and checks whether the
# execution leaves allocated memory behind (valid-memcleanup).
# It is applicable only to programs without nondeterministic choices.
# ----------------------------------------------------------------------

#include includes/execution-smg.properties
#include includes/resource-limits.properties

# Report memory errors as target states instead of just aborting the analysis.
cpa.smg2.memoryErrors = true

specification = specification/memorycleanup.spc
