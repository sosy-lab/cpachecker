# Bounded ordering-consistency analysis for overflows in concurrent programs.

#include orderingConsistency.properties

# the analysis reads the property from a property file given with --spec
specification = specification/overflow.spc

# CFA simplifications might remove overflows
cfa.simplifyCfa = false
cfa.simplifyConstExpressions = false

# self-reference to allow direct usage
overflow.config = orderingConsistency--overflow.properties
