#include dss.properties

# The workers need Z3 for symbolic execution. Loading MathSAT for the main analysis into the same
# process makes Z3 crash in native code (SIGSEGV in solverCheck), so the main analysis uses Z3 too.
solver.solver=Z3

[distributedSummaries]
debug=false
# Symbolic execution states carry no program point, so combining violation conditions by their
# program point would merge all conditions of a block into one, which its operator rejects.
combineVcsByHash=false
syntacticVcEquality=true
worker.forwardConfiguration=distributed-summary-synthesis/dss-symbolic-execution.properties