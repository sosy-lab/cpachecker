#include includes/isa-correctness-witness.properties

analysis.restartAfterUnknown = true

# The analyses used for termination property checking.
restartAlgorithm.configFiles = components/correctnessWitnessValidation-termination--terminationToSafety.properties
termination.config=correctness-witness-validation--terminationToSafety.properties

# The invariants of the witness are not checked by the invariant specification automaton, because
# the termination analysis does not refine the abstraction for these checks and would report
# spurious violations. Instead, the supporting invariants are proven before they are used.
witness.checkInvariantsHoldForEveryPath = false

witness.validation.correctness.config=correctness-witness-validation--terminationToSafety.properties

#include includes/resource-limits.properties