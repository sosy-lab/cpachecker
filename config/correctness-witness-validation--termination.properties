#include includes/isa-correctness-witness.properties
#include includes/resource-limits.properties

# Use parallel portfolio of analyses
analysis.useParallelAnalyses=true

parallelAlgorithm.configFiles = components/correctnessWitnessValidation-termination--terminationToSafety.properties, \
                                components/correctnessWitnessValidation-termination--decreasingSet.properties, \
                                components/correctnessWitnessValidation-termination--lassoAnalysis.properties

coverage.enabled=false

# The witnesses may refer to the memory of scalars that the verifier represented by variables
cfa.replaceScalarAllocations = true

termination.config=correctness-witness-validation--termination.properties
witness.validation.correctness.config=correctness-witness-validation--termination.properties

#include includes/resource-limits.properties
