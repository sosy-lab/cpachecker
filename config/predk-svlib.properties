# ----------------------------------------------------------------------
# PredK: predicate analysis in the PredK framework that hands a loop to
# an induction step where its predicates do not describe the loop. It
# starts as predicateAnalysis-svlib and refines with its interpolation. A
# spurious induction step gets longer, as in k-induction.
# ----------------------------------------------------------------------

#include predicateAnalysis-svlib.properties

CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.predicate.PredicateCPA, cpa.induction.InductionCPA, cpa.svlibsafetyspec.SvLibSafetySpecCPA, $specification

cegar.refiner = cpa.induction.refiner.PredKRefiner
cegar.globalRefinement = true

# As native BMC, k-induction, IMC and ISMC, analyze nothing without a target location.
cpa.induction.skipWithoutTargetLocations = true

# the abstractions at loop heads with k > 0 are no invariants
cpa.arg.export = false
# The refiner removes unreachable states without exploring their parents
# again, which needs path formulas that cover all paths to a state.
cpa.arg.lateMerge = prevent

cpa.induction.inductionStepCPAs = cpa.callstack.CallstackCPA
# as the step case of native k-induction
cpa.induction.resetMemoryInInductionStep = true

cpa.induction.refinement.predk.checkConcreteTargetsAsBmc = true
cpa.induction.refinement.predk.interpolateInductionSteps = false
cpa.induction.refinement.predk.moveApartForSingleVisits = false
