# ----------------------------------------------------------------------
# This configuration file uses a sequence of different 
# analyses to check for program termination for SV-COMP27.
# ----------------------------------------------------------------------

#include includes/resource-limits.properties

# Use this configuration as configuration for termination analysis.
termination.config = svcomp27--termination.properties

specification =

# This option replaces a loop of blank edges with the end of the program, which is not
# valid for the termination property. It is false by default, but the simple rules below
# can only see the CFA, not the configuration that created it, so they require the option
# to be set explicitly.
cfa.removeTrivialLoops = false

# The analyses run next to two cheap analyses that decide the easy tasks within seconds.
# The parallel algorithm reports the first conclusive result and an UNKNOWN of the simple
# checks does not stop the portfolio.
analysis.useParallelAnalyses = true

parallelAlgorithm.configFiles = components/svcomp27--simpleChecks-termination.properties, \
                                components/svcomp27--sequential-termination.properties

witness.yamlexporter.terminationWitness=witness.yml
witness.yamlexporter.nonterminationWitness=witness.yml

# Prevent the merge of two abstract states where one of them
# already has at least one child state.
# This prevents warnings about unexpected ARG branching
cpa.arg.lateMerge = prevent
