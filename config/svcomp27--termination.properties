# ----------------------------------------------------------------------
# This configuration file uses a sequence of different 
# analyses to check for program termination for SV-COMP27.
# ----------------------------------------------------------------------

#include includes/resource-limits.properties

# Use sequential combination of analyses.
analysis.restartAfterUnknown = true

# Use this configuration as configuration for termination analysis.
termination.config = svcomp27--termination.properties

specification =

# sequence of termination analyses used
restartAlgorithm.configFiles = components/svcomp27--parallel-termination.properties, \
                               components/svcomp27--termination-recursion.properties::if-recursive

termination.yamlProofWitness=witness.yml
terminationtoreach.terminationWitness=witness.yml

# Prevent the merge of two abstract states where one of them
# already has at least one child state.
# This prevents warnings about unexpected ARG branching
cpa.arg.lateMerge = prevent
