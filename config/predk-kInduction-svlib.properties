# ----------------------------------------------------------------------
# k-induction as an instance of the PredK framework: the base case unrolls
# the loops, and at the (k+1)-st visit of a loop head an induction step
# starts from an arbitrary state and callstack. The refiner runs the queries
# of native k-induction (base case, bounding assertions, step case) and
# increases k, starting at 1, if none of them decides.
# Compare with kInduction-plain-svlib.
# ----------------------------------------------------------------------

#include includes/predk-framework-svlib.properties

cegar.refiner = cpa.induction.refiner.KInductionRefiner

cpa.induction.k = 1
cpa.induction.induction = true
# as native k-induction, the base case up to the bound, then the induction steps
cpa.induction.describedAbstractions = 0
cpa.automaton.breakOnTargetState = 0

# exploration as in native k-induction
cpa.predicate.blk.alwaysAtLoops = false
analysis.traversal.useReverseLoopIterationCount = true
cpa.arg.lateMerge = prevent

specification = specification/correct-annotations.spc

# The simulation above matches native k-induction. The optimizations beyond it,
# all enabled in predk-kInduction-optimized-svlib:
# cpa.induction.refinement.kInduction.targetedBoundingAssertions = true
#   checks the bounding assertions again when the induction steps reach
#   targets, for the induction starts of these steps, whereas native
#   k-induction checks them only before the step case, for all states at
#   the bound
# predk-kInduction-combined-svlib instead explores the base case and the induction
# steps in one pass, as split-case k-induction does.
