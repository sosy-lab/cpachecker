# ----------------------------------------------------------------------
# This configuration file decides the termination of a program with
# trivial rules, i.e., without reasoning about what the program
# computes. Cf. includes/trivial-rules.properties.
# ----------------------------------------------------------------------

#include includes/trivial-rules.properties
#include includes/resource-limits.properties

# The termination property has no specification automaton: there is no property violation to
# look for, the rules argue about the loops of the program instead.
specification =

# This option replaces a loop of blank edges with the end of the program, which is not valid for
# the termination property. We set it explicitly because the rules can only see the CFA, not the
# configuration that created it.
cfa.removeTrivialLoops = false

# self-reference to allow direct usage
termination.config = trivialRules--termination.properties
