# Writes the ACSL annotations of the program as correctness witness in YAML format,
# whose invariants and function contracts are in ACSL.

parser.collectACSLAnnotations=true
analysis.useAcslToWitnessAlgorithm=true

cpa=cpa.arg.ARGCPA
ARGCPA.cpa=cpa.composite.CompositeCPA
CompositeCPA.cpas=cpa.location.LocationCPA, cpa.callstack.CallstackCPA, \
cpa.functionpointer.FunctionPointerCPA
