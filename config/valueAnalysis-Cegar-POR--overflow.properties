# Overflow analysis for concurrent programs: valueAnalysis-Cegar-POR.properties with the
# OverflowCPA and the no-overflow specification.

#include valueAnalysis-Cegar-POR.properties
#include includes/overflow.properties

specification = specification/overflow.spc
overflow.config = valueAnalysis-Cegar-POR--overflow.properties
# PointerCPA: needed for soundness of writes through pointers.
CompositeCPA.cpas = cpa.mutex.MutexCPA, cpa.value.ValueAnalysisCPA, cpa.pointer2.PointerCPA, cpa.overflow.OverflowCPA
counterexample.checker.config = cex-checks/predicateAnalysis-POR-as-cex-check-overflows.properties
