# Experimental single-run DSS configuration: no portfolio or stage-specific time limits.
# Resource limits may still be supplied by the caller. This is not a coverage replacement:
# deferring abstractions helps some tasks but can make violation formulas expensive on others.
#include distributed-summary-synthesis/dss-analysis.properties

specification=specification/default.spc

# Keep branch boundaries to avoid large disjunctive block relations in feasibility queries.
distributedSummaries.decomposition.largestHorizontalMerge=50
distributedSummaries.decomposition.mergeBranchBoundaries=false
distributedSummaries.worker.forwardConfiguration=distributed-summary-synthesis/dss-block-analysis-exact.properties
