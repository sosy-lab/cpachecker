# ----------------------------------------------------------------------
# This configuration file checks for overflows with k-induction and
# exports the proof as a YAML correctness witness.
# ----------------------------------------------------------------------

#include components/kInduction/correctnessWitnesses-kInduction--overflow.properties

# CPAchecker generates the CFA only once, shared across the parallel
# sub-configs combining k-induction with the invariant supplier, so this
# must be set consistently at the top level for all of them.
analysis.summaryEdges = true

# this automaton defines which locations are the error locations
specification = specification/overflow.spc

# This is the configuration used when verifying the overflow property
overflow.config = correctness-witnesses-k-induction--overflow.properties

#include includes/resource-limits.properties
