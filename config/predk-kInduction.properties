# ----------------------------------------------------------------------
# k-induction as an instance of the PredK framework: the base case unrolls
# the loops, and at the (k+1)-st visit of a loop head an induction step
# starts from an arbitrary state and callstack. The refiner runs the queries
# of native k-induction (base case, bounding assertions, step case) and
# increases k, starting at 1, if none of them decides.
# Compare with kInduction-plain.
# ----------------------------------------------------------------------

#include includes/predk-framework.properties

cegar.refiner = cpa.induction.refiner.KInductionRefiner

CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA, cpa.induction.InductionCPA, cpa.value.ValueAnalysisCPA, cpa.pointer2.PointerCPA, cpa.input.InputCPA, $specification
cpa.value.merge = JOIN

cpa.induction.k = 1
cpa.induction.induction = true
cpa.induction.abstractedCPAs = cpa.value.ValueAnalysisCPA, cpa.pointer2.PointerCPA, cpa.input.InputCPA
cpa.induction.inductionStepCPAs = cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA
cpa.automaton.breakOnTargetState = 0

# exploration as in native k-induction
cpa.predicate.blk.alwaysAtLoops = false
analysis.traversal.useReverseLoopIterationCount = true
cpa.arg.lateMerge = prevent
cfa.removeTrivialLoops = true

specification = specification/default.spc

#include includes/resource-limits.properties
