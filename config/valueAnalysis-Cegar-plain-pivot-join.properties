# ----------------------------------------------------------------------
# Experimental variant of valueAnalysis-Cegar-plain.properties that
# avoids restarting the whole reached set from the root on every
# refinement (PIVOT instead of ROOT) and allows merging of states with
# equal precision at the same location (JOIN instead of SEP), to cut
# down on redundant re-exploration of call contexts.
# ----------------------------------------------------------------------

#include valueAnalysis-Cegar-plain.properties

[cpa.value.refinement]
restart = PIVOT

cpa.value.merge = JOIN
