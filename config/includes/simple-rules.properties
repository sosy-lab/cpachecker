# ------------------------------------------------------------------
# This configuration file decides a specification with trivial
# rules: arguments that settle a proposition without reasoning about
# what the program computes ("a program without loops and without
# recursion terminates", "a program that never allocates memory
# cannot leak memory", ...). Every rule may abstain, and the result
# is UNKNOWN if the propositions of the specification are not
# settled, so an answer is never a guess.
# The rules only read the CFA, which makes this configuration a
# cheap first component of a portfolio.
# ------------------------------------------------------------------

analysis.algorithm.trivialRules = true

# Which of the configurations to use for the individual properties, such that every
# configuration can be used with a property file from the command line (e.g.,
# "--spec test/programs/benchmarks/properties/termination.prp").
# Everything else in the current configuration is then ignored.
# The paths are relative to this file, i.e., to config/includes/.
memorysafety.config = ../trivialRules--memorysafety.properties
memorycleanup.config = ../trivialRules--memorycleanup.properties
overflow.config = ../trivialRules--overflow.properties
datarace.config = ../trivialRules--datarace.properties
termination.config = ../trivialRules--termination.properties
