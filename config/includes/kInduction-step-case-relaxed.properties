// ----------------------------------------------------------------------
// Options for the induction step case of k-induction, loaded via
// bmc.stepCaseConfig (cf. #1694). They let the step case collapse states
// that the base case keeps apart, without dropping any path.
//
// Without these options the step case does not even finish unrolling for
// k = 1 on some tasks: in BMC mode merge^JOIN is the only mechanism that can
// collapse states at all (the predicate domain covers a state only if the path
// formulas are identical), merge is only ever attempted between states of the
// same reached-set partition, and the partition key distinguishes practically
// every state, because CallstackState is compared by object identity by design
// and LoopBoundState carries the whole per-loop iteration vector.
//
// The options must not be put into the configuration of the analysis: only
// the step case takes the iteration ranges of merged states into account.
// ----------------------------------------------------------------------

// Partition the reached set by location, call chain and (smallest) deepest
// loop iteration instead of by every Partitionable component, so that
// merge^JOIN is attempted at all. Partitioning by location alone also enables
// merging, but makes every merge scan all states at that location.
analysis.reachedSet = INDUCTIONPARTITIONED

// Compare call stacks by content instead of by object identity, so that two
// invocations of the same function can be merged and cover each other.
cpa.callstack.domain = FLATPCC

// Merge states with different per-loop iteration counts and keep, for each
// loop, the smallest and the largest count. The step case only cuts off a
// merged state once all of its paths exceed the bound, and checks every state
// that may contain a path of iteration k+1.
cpa.loopbound.domain = RANGE
