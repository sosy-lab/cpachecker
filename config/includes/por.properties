cpa = cpa.arg.ARGCPA
ARGCPA.cpa = cpa.concurrent.ConcurrentCPA
ConcurrentCPA.cpa = cpa.composite.CompositeCPA

analysis.traversal.order = dfs
analysis.traversal.useReversePostorder = true
cpa.composite.aggregateBasicBlocks = false

cpa.concurrent.aggregateBasicBlocks = true

analysis.traversal.useNumberOfThreads  = true
analysis.traversal.weightedDepth       = false

# The ARG runs on per-thread CFA clones without a ThreadingCPA. The YAML witness handles this
# (thread ids from the ConcurrentState, locations via the original CFA), but the GraphML/DOT
# witness would lack threadId/createThread, and the C source and harness exports cannot represent
# an interleaving, so keep only the YAML witness.
counterexample.export.exportAsSource = false
counterexample.export.exportWitness = false
counterexample.export.exportHarness = false
