# ------------------------------------------------------------------
# Like includes/execution.properties, but with the SMG analysis
# instead of the plain value analysis. The SMG analysis models the
# heap and a stack of function frames explicitly, so it is precise
# for programs that write to memory through pointers and it handles
# recursion without any help from ExecutionCPA. It is also the
# analysis that the memory-safety automata query.
# ------------------------------------------------------------------

#include execution.properties

CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.smg2.SMGCPA, $specification

# An execution has concrete values only, so there is no need for symbolic values,
# predicates, or any kind of abstraction.
cpa.smg2.trackPredicates = false
cpa.smg2.trackErrorPredicates = false
cpa.smg2.treatSymbolicValuesAsUnknown = true
cpa.smg2.abstraction.abstractProgramVariables = false
cpa.smg2.abstraction.abstractHeapValues = false

# A failing allocation is a nondeterministic choice, and a real execution does not
# make it. Assume that allocation always succeeds.
cpa.smg2.enableMallocFail = false
