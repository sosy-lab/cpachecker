# ----------------------------------------------------------------------
# The common part of the configs of the PredK framework: one exploration
# with the InductionCPA, and a CEGAR refiner that simulates an algorithm
# by changing the precision. The refiner gets the complete exploration.
# ----------------------------------------------------------------------

analysis.algorithm.CEGAR = true
cegar.globalRefinement = true

cpa = cpa.arg.ARGCPA
ARGCPA.cpa = cpa.composite.CompositeCPA
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA, cpa.induction.InductionCPA, $specification

# As native BMC, k-induction, IMC and ISMC, analyze nothing without a target location.
cpa.induction.skipWithoutTargetLocations = true

# An abstraction forgets the values, and an induction step also the callstack and
# the memory, as the step case of native k-induction starts from the initial state
# of every CPA. CPAs that a config does not use are left out.
cpa.induction.abstractedCPAs = cpa.value.ValueAnalysisCPA, cpa.pointer2.PointerCPA, cpa.input.InputCPA
cpa.induction.inductionStepCPAs = cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA
cpa.induction.resetMemoryInInductionStep = true

# The InductionCPA decides where to abstract at loop heads.
cpa.predicate.blk.alwaysAtLoops = true
cpa.predicate.blk.alwaysAtFunctions = false

# The abstractions at loop heads with k > 0 are no invariants, so the configs
# export no correctness witnesses (and no ARG). Counterexamples are exported.
cpa.arg.export = false

analysis.traversal.order = bfs
analysis.traversal.useReversePostorder = true
analysis.traversal.useCallstack = true
