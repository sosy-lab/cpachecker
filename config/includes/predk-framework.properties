# ----------------------------------------------------------------------
# The common part of the configs of the PredK framework: one exploration
# with the InductionCPA, and a CEGAR refiner that simulates an algorithm
# by changing the precision. The refiner gets the complete exploration.
# ----------------------------------------------------------------------

analysis.algorithm.CEGAR = true
cegar.globalRefinement = true

cpa = cpa.arg.ARGCPA
ARGCPA.cpa = cpa.composite.CompositeCPA
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA, cpa.induction.InductionCPA, $specification

# The InductionCPA decides where to abstract at loop heads.
cpa.predicate.blk.alwaysAtLoops = true
cpa.predicate.blk.alwaysAtFunctions = false

analysis.traversal.order = bfs
analysis.traversal.useReversePostorder = true
analysis.traversal.useCallstack = true
