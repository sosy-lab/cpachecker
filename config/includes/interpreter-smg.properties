# ------------------------------------------------------------------
# Like includes/interpreter.properties, but with the SMG analysis
# instead of the plain value analysis. The SMG analysis models the
# heap and a stack of function frames explicitly, so it is precise
# for programs that write to memory through pointers and it handles
# recursion without any help from InterpreterCPA. It is also the
# analysis that the memory-safety automata query.
# ------------------------------------------------------------------

# Default resource limits
#include ../includes/resource-limits.properties

#include interpreter.properties
#include smg/smgSymbolicExecution-memSafety.properties

# Switch the CPAs to SMGCPA
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.smg2.SMGCPA, $specification

# A failing allocation is a nondeterministic choice, which would end every execution
# at the first allocation. Execute the program as if every allocation succeeds, which
# still finds the violations of that execution. InterpreterCPA knows that such an
# execution is not the only one of the program and reports UNKNOWN instead of a proof.
cpa.smg2.enableMallocFail = false
cpa.smg2.enableCallocFail = false
cpa.smg2.enableReallocFail = false
