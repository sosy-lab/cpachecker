# ------------------------------------------------------------------
# This configuration file executes the program with a value analysis
# instead of abstracting it. It is applicable only to programs that
# do not make any nondeterministic choice, i.e., programs without
# input. For such a program there is exactly one execution, so the
# analysis is exact: it reports TRUE if the execution terminates
# without violating the specification, and FALSE otherwise. If the
# program does make a nondeterministic choice, the analysis detects
# this (the transfer relation produces more than one successor) and
# reports UNKNOWN.
# Termination of the analysis also proves termination of the program,
# because no abstract state is ever covered by another one.
# ------------------------------------------------------------------

cpa = cpa.execution.ExecutionCPA
ExecutionCPA.cpa = cpa.composite.CompositeCPA
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.value.ValueAnalysisCPA, $specification

# There is no bound on the depth of recursion: ExecutionCPA executes recursive
# functions like every other function and restores the values of a caller when
# a recursive call returns.
cpa.callstack.depth = 2147483647

# The reached set contains only a handful of states (cf. cpa.execution.stepsPerTransfer),
# so there is nothing to be gained from partitioning it.
analysis.reachedSet = NORMAL

# Which of the execution configurations to use for the individual properties, such that
# every execution configuration can be used with a property file from the command line
# (e.g., "--spec test/programs/benchmarks/properties/termination.prp").
# Everything else in the current configuration is then ignored.
# The paths are relative to this file, i.e., to config/includes/.
memorysafety.config = ../execution--memorysafety.properties
memorycleanup.config = ../execution--memorycleanup.properties
overflow.config = ../execution--overflow.properties
termination.config = ../execution--termination.properties

# NOTE: The waitlist always contains exactly one state, so we keep the default traversal
# order (DFS with a plain waitlist) instead of one of the more expensive waitlists.

# NOTE: Calls to functions without a body are ignored by the value analysis, which is unsound
# if such a function has side effects. CPAchecker logs a warning in this case. If the return
# value of such a call is used in a condition, ExecutionCPA detects the resulting
# nondeterminism and reports UNKNOWN.

# NOTE: By default the whole program is executed within a single call of the transfer relation,
# so the reached set contains only two states and the analysis needs a constant amount of
# memory for the state space. This also means that there is no ARG and thus no counterexample
# to export. In order to get a counterexample (at the price of one state per execution step),
# add the following to the command line:
#   --option cpa.execution.stepsPerTransfer=1 \
#   --option cpa=cpa.arg.ARGCPA --option ARGCPA.cpa=cpa.execution.ExecutionCPA \
#   --option counterexample.export.enabled=true
