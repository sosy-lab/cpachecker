# Variables classified as irrelevant might be in fact relevant,
cpa.predicate.ignoreIrrelevantVariables = false

cpa.predicate.enableMemoryAssignmentFunctions = true

# Do not overwrite termination witness with ARG witness
cpa.arg.exportYamlCorrectnessWitness=false
counterexample.export.exportWitnessV2=false

# Termination analysis requires the TerminationToSafetyAlgorithm.
analysis.algorithm.terminationToSafety = true

# Scalars in alloca memory are represented by variables, which the analysis handles better
cfa.replaceScalarAllocations = true

cpa.terminationviamemory.disableTransitionAbstractions=true
cpa.predicate.blk.alwaysAtLoops=true
cpa.predicate.blk.alwaysAtFunctions = false

cpa = cpa.arg.ARGCPA
ARGCPA.cpa = cpa.composite.CompositeCPA

CompositeCPA.cpas = cpa.location.LocationCPA, \
                    cpa.predicate.PredicateCPA, \
                    cpa.value.ValueAnalysisCPA, \
                    cpa.callstack.CallstackCPA, \
                    cpa.terminationviamemory.TerminationToReachCPA

# BFS is better than DFS, because non-terminating loop might be in other branches.
[analysis.traversal]
order = bfs