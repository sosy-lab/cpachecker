# ------------------------------------------------------------------
# SMGv2 w symbolic execution
#   + assignment of concrete values for symbolic offsets and memory sizes
# ------------------------------------------------------------------

#include smgSymbolicExecution.properties

# Assign concrete values for symbolic offsets
cpa.smg2.overapproximateSymbolicOffsets = false
cpa.smg2.findConcreteValuesForSymbolicOffsets = true

# Substitute the assigned concrete values in the offsets of pointers as well
cpa.smg2.substituteSymbolicOffsetInPointersWithConcreteAssignments = true

# Split accesses with symbolic offsets into states for each concrete offset, restricted by
# constraints, instead of assigning concrete values to the symbolic values in the offset
cpa.smg2.useConcreteValueSummaryAssignments = true
