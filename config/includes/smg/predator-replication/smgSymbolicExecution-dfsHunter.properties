# ------------------------------------------------------------------
# SMGv2 w symbolic execution as a DFS hunter
# with no bound to its depth.
# See smgHP.properties for more info.
# ------------------------------------------------------------------

# Default resource limits
#include ../../resource-limits.properties

#include ../smgSymbolicExecution.properties

# Load the PathConditionsCPA so that we can limit the path length
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.conditions.path.PathConditionsCPA, cpa.smg2.SMGCPA

# This configuration is used when verifying with MemSafety/MemCleanup properties
memorysafety.config = smgSymbolicExecution-dfsHunter-memsafety.properties
memorycleanup.config = smgSymbolicExecution-dfsHunter-memsafety.properties

# Set merge to isomorphic merge only (and only at certain locations)
cpa.smg2.merge.generalPolicy = SEP
cpa.smg2.merge.policyOnLoopClosing = ISOMORPHISM_ONLY
cpa.smg2.merge.policyOnLoopHead = ISOMORPHISM_ONLY
cpa.smg2.merge.policyOnFunctionExit = ISOMORPHISM_ONLY
# Disable abstraction
cpa.smg2.abstraction.usePrecisionAdjustmentForShapeAbstraction = NEVER

# TODO: Do we need a selector for the MergePolicy in stop directly?
cpa.smg2.stop.stopOperatorPolicy = TRY_MERGE_SMART

cpa.smg2.merge.exclusivelyWithAbstractionPresent = false

# Prevent the merge of two abstract states where one of them
# already has at least one child state.
# Needed when merging, irrelevant else.
cpa.arg.lateMerge = PREVENT

# We only merge states at equal locations in the program.
# We use PARTITIONED, resulting in a cross-product of the used CPAs distinct partitions.
# The LocationCPA uses only Merge-SEP and is used before SMG2CPA,
# hence we get only equal locations to merge with.
analysis.reachedSet = PARTITIONED

# Max path length (-1 is unlimited)
cpa.conditions.path.condition    = PathLengthCondition
cpa.conditions.path.length.limit = -1

[analysis.traversal]
order               = dfs
useReversePostorder = false
useCallstack        = false
weightedDepth       = false
random.exponent     =
