# ------------------------------------------------------------------
# SMGv2 w symbolic execution as a DFS hunter
# with an approximated bound of 1900 GIMBAL instructions.
# See smgHP.properties for more info.
# ------------------------------------------------------------------

# Default resource limits
#include ../../resource-limits.properties

#include smgSymbolicExecution-dfsHunter.properties

# This configuration is used when verifying with MemSafety/MemCleanup properties
memorysafety.config = smgSymbolicExecution-dfsHunter1900-memsafety.properties
memorycleanup.config = smgSymbolicExecution-dfsHunter1900-memsafety.properties

# TODO: Find a good approximation for the 1900 that PredatorHP uses here
cpa.conditions.path.length.limit = 1900
