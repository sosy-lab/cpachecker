# ------------------------------------------------------------------
# SMGv2 w symbolic execution and memorysafety specification with merge
# (based on Predators join). Uses DFS for better states to merge.
# ------------------------------------------------------------------

# Default resource limits
#include ../../resource-limits.properties

#include ../smgSymbolicExecution.properties

# This configuration is used when verifying with MemSafety/MemCleanup properties
memorysafety.config = smgSymbolicExecution-merge-noFalse-memsafety.properties
memorycleanup.config = smgSymbolicExecution-merge-noFalse-memsafety.properties

# We do not return errors due to the overapproximation when using the merge operator
cpa.reportFalseAsUnknown = true

# Enable merge as defined by Predator:
# - join only when traversing a loop-closing edge, skips the isomorphism check when considered redundant.
# - do not perform abstraction on each end of BB, but only when looping.
# (i.e. abstraction is performed only at loop closing edges,
# but isomorphism is checked on endings of basic blocks, e.g. function returns, gotos, loop-heads etc.)
cpa.smg2.merge.generalPolicy = NONE
cpa.smg2.merge.policyOnLoopClosing = ISOMORPHISM_ONLY
cpa.smg2.merge.policyOnLoopHead = MERGE_WITH_ABSTRACTION
cpa.smg2.merge.mergePolicyOnFunctionExit = ISOMORPHISM_ONLY

# TODO: Do we need a selector for the MergePolicy in stop directly?
cpa.smg2.stop.policyForStopOperator = TRY_MERGE_SMART

cpa.smg2.merge.mergeOnlyWithAbstractionPresent = false



# Prevent the merge of two abstract states where one of them
# already has at least one child state.
# Needed when merging, irrelevant else.
cpa.arg.lateMerge = PREVENT

# We only merge states at equal locations in the program.
# We use PARTITIONED, resulting in a cross-product of the used CPAs distinct partitions.
# The LocationCPA uses only Merge-SEP and is used before SMG2CPA,
# hence we get only equal locations to merge with.
analysis.reachedSet = PARTITIONED

# Predator(HP) uses: "DFS scheduler, move already scheduled blocks to front of queue"
[analysis.traversal]
order               = dfs
useReversePostorder = false
useCallstack        = false
weightedDepth       = false
