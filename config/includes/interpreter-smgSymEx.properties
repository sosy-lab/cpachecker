# ------------------------------------------------------------------
# Like includes/interpreter.properties, but with the SMG analysis
# instead of the plain value analysis. The SMG analysis models the
# heap and a stack of function frames explicitly, so it is precise
# for programs that write to memory through pointers and it handles
# recursion without any help from InterpreterCPA. It is also the
# analysis that the memory-safety automata query.
# This variant uses the SMG2 options of symbolic execution and lets
# allocations fail, cf. interpreter-smgValueAnalysis.properties.
# ------------------------------------------------------------------

#include interpreter.properties

# Switch the CPAs to SMGCPA
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.smg2.SMGCPA, $specification

# Use the SMG2 options of symbolic execution (see smg/smgSymbolicExecution.properties).
# Do not include that file (or its variants) here: it is a complete analysis configuration
# and would override the InterpreterCPA setup above (e.g., cpa, cpa.callstack.depth) and
# set CFA options (cfa.simplifyCfa) that break nesting these configs in simpleChecks--*.
cpa.smg2.trackPredicates = true
cpa.smg2.trackErrorPredicates = true
cpa.smg2.treatSymbolicValuesAsUnknown = false
cpa.smg2.abstraction.abstractProgramVariables = false
cpa.smg2.abstraction.abstractHeapValues = false
