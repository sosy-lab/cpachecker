# Run the two simple analyses concurrently. ParallelAlgorithm takes the first conclusive
# result and cancels the other analysis; an UNKNOWN result does not stop the portfolio.
analysis.useParallelAnalyses = true

memorysafety.config = ../simpleChecks--memorysafety.properties
memorycleanup.config = ../simpleChecks--memorycleanup.properties
overflow.config = ../simpleChecks--overflow.properties
termination.config = ../simpleChecks--termination.properties
# ExecutionCPA has no data-race analysis; keep the applicable trivial rules for this property.
datarace.config = ../trivialRules--datarace.properties
