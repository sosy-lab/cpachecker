# ----------------------------------------------------------------------
# ISMC as an instance of the PredK framework: the counterexample search
# unrolls the loops n times with one block per iteration, and the
# interpolation sequences of its spurious counterexamples are conjoined
# into a reachability vector. The frame phase abstracts every visit of a
# loop head with all frames as predicates and closes the loops by
# coverage. If the interpolants add nothing, n increases. As native ISMC,
# the refiner falls back to BMC for more than one loop head and after a
# failed interpolation.
# Compare with bmc-interpolationSequence.
# ----------------------------------------------------------------------

#include includes/predk-framework.properties

cegar.refiner = cpa.induction.refiner.IsmcRefiner

# the counterexample search with bound 1
cpa.induction.k = 0
cpa.induction.describedAbstractions = 1
cpa.induction.unrolling = true
cpa.automaton.breakOnTargetState = 0

# interpolation and exploration as in native ISMC
cpa.predicate.merge.mergeAbstractionStatesWithSamePredecessor = true
cpa.predicate.refinement.sequentialStrategy = BWD_FALLBACK
cpa.predicate.refinement.incrementalCexTraceCheck = false
cpa.predicate.refinement.reuseInterpolationEnvironment = true
cpa.predicate.refinement.cexTraceCheckDirection = FORWARDS
cpa.predicate.refinement.tryWithoutInterpolation = false
analysis.traversal.useReverseLoopIterationCount = true
cpa.arg.lateMerge = prevent
cfa.removeTrivialLoops = true

specification = specification/default.spc

#include includes/resource-limits.properties

# The simulation above matches native ISMC. The optimizations beyond it,
# all enabled in predk-ismc-optimized:
# cpa.induction.refinement.ismc.bmcFallback = false
#   applies ISMC to programs with several loop heads and continues after a
#   failed interpolation, where native ISMC falls back to BMC
