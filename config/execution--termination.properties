# ----------------------------------------------------------------------
# This configuration file proves termination by executing the program:
# the analysis never covers an abstract state by another one, so it
# performs exactly as many steps as the program does and terminates if
# and only if the program terminates.
# It is applicable only to programs without nondeterministic choices.
# Note that a non-terminating program leads to the result UNKNOWN
# (after the time limit), not to FALSE.
# ----------------------------------------------------------------------

#include includes/execution.properties
#include includes/resource-limits.properties

# The termination property has no specification automaton, so we cannot use the
# $specification placeholder here (it requires at least one automaton). Instead we add the
# automaton that tells the analysis which functions do not return, such that the execution
# ends at a call of exit() or abort() instead of continuing after it.
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.value.ValueAnalysisCPA, cpa.automaton.ControlAutomatonCPA TerminatingFunctionsAutomaton

# There is no property violation to look for: the program terminates if and only if the
# analysis does. Any automaton given with '--spec' is added to the CPAs above.
specification =

[TerminatingFunctionsAutomaton]
cpa.automaton.inputFile = specification/TerminatingFunctions.spc
