# Explore acyclic blocks without intermediate abstractions. Learn compound boundary predicates
# from refuted violation conditions, and abstract summaries only in the error-free ELSE branch.
#include dss-block-analysis-predicate.properties

dss.exactBoundaryRefinement=true

# Retain Boolean correlations between predicates in outgoing summaries.
cpa.predicate.abstraction.computation=BOOLEAN
