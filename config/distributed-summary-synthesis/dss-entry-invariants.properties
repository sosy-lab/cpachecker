#include ../components/invariantGeneration-no-out.properties

# Small bounded ranges are useful for exact block queries. Avoid widening away
# those bounds; the caller discards the whole pass if it exceeds its time budget.
cpa.invariants.maximumFormulaDepth=1
cpa.invariants.interestingVariableLimit=0
cpa.invariants.includeTypeInformation=false
cpa.invariants.conditionAdjusterFactory=STATIC
cpa.invariants.abstractionStateFactory=NEVER
