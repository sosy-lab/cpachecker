#include ../includes/predicateAnalysis-PredAbsRefiner-ABEl.properties

# configuration for a distributed forward predicate analysis
# see dss.properties for more information on the configuration of
# distributed summary synthesis

specification = ../specification/default.spc
CompositeCPA.cpas=cpa.block.BlockCPA, cpa.location.LocationCPA, cpa.callstack.DssCallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA, $specification

cpa.callstack.domain=FLATPCC

# States inside a block are merged (see BlockCPA), so the path formula of a state is a disjunction
# over the paths that reach it. A counterexample the refiner finds is therefore feasible for the
# disjunction without the single ARG path that is reconstructed for it having to be satisfiable.
# The violation conditions this block sends are not derived from that path: DssBlockAnalysis
# enumerates all paths to a target itself and computes a condition for each.
counterexample.export.allowImpreciseCounterexamples=true

[cpa.predicate]
strengthenWithFormulaReportingStates=true
handlePointerAliasing=true
