# Predicate CEGAR worker used by the optimized DSS configuration.
#include dss-block-analysis.properties

# Share ARG paths and learn boundary predicates with ordinary predicate CEGAR.
dss.graphViolationConditions=true
# The static refiner does not add all assumptions of the CFA to the precision (inherited default):
# extracting them encodes the statements that affect them, which fails on code like realloc that
# the analysis itself never has to encode, and it solved fewer tasks.

# Remove private intermediate values, including those inside shared disjunctions.
dss.cpa.predicate.projectViolationConditions=true
dss.cpa.predicate.projectNestedDisjunctions=true
# Generalize conditions in the received precondition vocabulary, with exact fallback.
dss.cpa.predicate.generalizeViolationConditions=true
dss.cpa.predicate.generalizeOverPreconditionPredicates=true
# Only for programs that hardly use modelled memory (at most 5% of the encoded CFA edges access it):
# with the pointer-aliasing encoding, generalization and nested projection cost much more than they
# save (e.g., aws-c-common), so such programs only get the cheap projection.
dss.cpa.predicate.maxMemoryShareForExpensiveSimplification=0.05

cpa.predicate.precision.sharing=SCOPE
cpa.predicate.abstraction.computation=BOOLEAN

# Smaller initial tables grow on demand.
bdd.javabdd.initTableSize=1000

# Abstract only at block boundaries and targets.
[cpa.predicate]
blk.threshold=0
blk.alwaysAtLoops=false
blk.alwaysAtFunctions=false
blk.alwaysAtFunctionHeads=false
blk.alwaysAtEntryFunctionHead=false
blk.alwaysAtFunctionCallNodes=false
blk.alwaysAtFunctionExit=false
blk.alwaysAtJoin=false
blk.alwaysAtBranch=false
blk.alwaysAtProgramExit=false
