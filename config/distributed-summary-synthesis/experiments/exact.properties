# Experimental exact block exploration with deferred boundary abstraction.
# Faster on some large tasks, but known to time out on additional small examples.
#
# - Acyclic inlined blocks with branch boundaries merged; loop boundaries remain.
# - PARTIAL_REPLACE retains exact exploration and abstracts summaries in the ELSE branch.
# - Compound boundary interpolants support Cartesian summaries without Boolean enumeration.
# - Exact forward formulas provide violation conditions when non-predicate paths agree.

#include ../../dss-inlining.properties

[distributedSummaries]
blockAnalysisType = PARTIAL_REPLACE
inferEntryCallstacks = true
# Private witnesses are fresh on each use; avoid expensive equality queries for their formulas.
syntacticVcEquality = true

[distributedSummaries.decomposition]
largestHorizontalMerge = -1
mergeBranchBoundaries = true

[distributedSummaries.worker]
forwardConfiguration = ../dss-block-analysis-exact.properties
