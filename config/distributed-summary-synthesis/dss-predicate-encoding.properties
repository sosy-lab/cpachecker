# How DSS encodes memory in path formulas. The block analyses exchange formulas, so all of them
# have to use the same encoding. predicateAnalysis-dssBlockEntries.properties includes this file
# too, so that it is compared with DSS on the same encoding.

[cpa.predicate]
handlePointerAliasing=false
# memcpy, memmove and memset; without pointer aliasing they remain unsupported.
enableMemoryAssignmentFunctions=true
