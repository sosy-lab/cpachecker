# Reachability analysis for concurrent programs: value analysis (CEGAR) on per-thread CFA
# clones, with partial-order reduction and a predicate-analysis counterexample check.

specification = specification/default.spc
#include includes/valueAnalysis-Cegar.properties
#include includes/por.properties
#include includes/resource-limits.properties

cpa.callstack.unsupportedFunctions = pthread_key_create,pthread_getspecific,pthread_setspecific,pthread_cond_wait,pthread_cond_signal,strcpy

counterexample.checker.config = cex-checks/predicateAnalysis-POR-as-cex-check.properties
# The AUTOMATON counterexample cannot express a path through the per-thread CFA clones, so
# the check refutes real violations; the witness-v2 form replays them.
counterexample.checker.counterexampleFormat = WITNESSV2

# PointerCPA is needed for soundness: without it, the value analysis silently
# drops writes through pointers (*p = ...).
CompositeCPA.cpas = cpa.mutex.MutexCPA, cpa.value.ValueAnalysisCPA, cpa.pointer2.PointerCPA
