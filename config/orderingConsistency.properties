# Bounded ordering-consistency analysis for concurrent programs.

#include includes/resource-limits.properties

analysis.algorithm.OC = true

datarace.config = orderingConsistency.properties

cpa = cpa.arg.ARGCPA
ARGCPA.cpa = cpa.oc.OrderingConsistencyCPA

analysis.traversal.order = bfs
analysis.traversal.useReversePostorder = true

# OC aliases at the event level itself; no pointer-aliasing modeling needed
cpa.predicate.handlePointerAliasing = false

# renamed event accesses aren't in the variable classification
cpa.predicate.ignoreIrrelevantVariables = false
cpa.predicate.ignoreIrrelevantFields = false

# iterative deepening: initial bound, step, final bound (negative = unbounded)
oc.initialLoopBound = 5
oc.loopBoundStep = 5
oc.finalLoopBound = -1

# ARG is a forest, one tree per thread instance
coverage.enabled = false
cpa.arg.export = true
counterexample.export.enabled = true
# the counterexample is one interleaving of the whole execution, built as a synthetic path
# (OrderingConsistencyAlgorithm#attachCounterexample); it carries the executing thread instance on
# every state, which is what the version 2 violation witness needs for its thread ids. The source
# and GraphML exports cannot represent a thread-crossing path, so they stay off.
counterexample.export.exportAsSource = false
counterexample.export.exportWitness = false
counterexample.export.exportWitnessV2 = true
counterexample.export.exportHarness = false

cpa.callstack.depth = 50
cpa.callstack.unsupportedFunctions = pthread_key_create,pthread_getspecific,pthread_setspecific,pthread_cond_wait,pthread_cond_signal,strcpy
