# ----------------------------------------------------------------------
# This configuration file uses a parallel portfolio of different 
# SMG-Analyses to analyse MemorySafety properties for SV-COMP27.
# ----------------------------------------------------------------------

#include includes/resource-limits.properties

# The analyses run next to two cheap analyses that decide the easy tasks within seconds.
# The parallel algorithm reports the first conclusive result and an UNKNOWN of the simple
# checks does not stop the portfolio.
analysis.useParallelAnalyses = true

parallelAlgorithm.configFiles = components/svcomp27--simpleChecks-memsafety.properties, \
                                components/svcomp27--sequential-memsafety.properties

# specification to find memory related problems
specification = specification/sv-comp-memorysafety.spc

# This is the configuration used when verifying memory safety properties (actually this configuration).
memorysafety.config = svcomp27--memorysafety.properties

# There are lots of calls to functions that are irrelevant, e.g. time(). We want to check the inputs, but are ok with the rest
# cpa.smg2.handleUnknownFunctions = ASSUME_EXTERNAL_ALLOCATED
# TODO: check which is better
cpa.smg2.handleUnknownFunctions=ASSUME_SAFE

# We do not export v2 witnesses for memsafety/memcleanup for now, as they are not ready!
cpa.arg.yamlProofWitness = 
counterexample.export.yaml = 

# simplified CFA is bad for witnesses
cfa.simplifyCfa = false

# sound for this specification and useful for some analyses
cfa.removeTrivialLoops = true

# atexit is supported by SMG2
cpa.callstack.unsupportedFunctions=pthread_create,pthread_key_create,sin,cos,__builtin_uaddl_overflow,_longjmp,longjmp,siglongjmp
