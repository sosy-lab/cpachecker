# -----------------------------------------------------------------------------
# This configuration file uses sets of intervals to check the overflow property
# for witness checking.
# -----------------------------------------------------------------------------

#include includes/witness-validation.properties
#include includes/witness-export.properties
#include includes/witness-validation--overflow.properties

# The analyses used for the overflow property. In contrast to the included list, multi-threaded
# programs are validated with an analysis that explores thread interleavings.
restartAlgorithm.configFiles = components/predicateAnalysis--overflow.properties, \
                               predicateAnalysis-bam-rec--overflow.properties::if-recursive, \
                               components/violationWitnessValidation--concurrency--overflow.properties::if-concurrent

# if we find a concurrent program, we copy the CFA to avoid colliding function names.
cfa.useCFACloningForMultiThreadedPrograms = true

# self-reference to allow direct usage
overflow.config = witness-validation--overflow.properties

specification = specification/overflow.spc
