# ----------------------------------------------------------------------
# This configuration file decides the absence of a signed integer
# overflow with trivial rules, i.e., without reasoning about what the
# program computes. Cf. includes/trivial-rules.properties.
# ----------------------------------------------------------------------

#include includes/trivial-rules.properties
#include includes/resource-limits.properties

specification = specification/overflow.spc

# The rules argue about the arithmetic of the program, so the CFA has to contain it: by default
# the parser evaluates a constant expression such as "2147483647 + 1" and puts the value it
# wrapped around to into the CFA, which hides the overflow. The rule that proves the absence of
# an overflow abstains if this option is not disabled.
cfa.simplifyConstExpressions = false

# self-reference to allow direct usage
overflow.config = trivialRules--overflow.properties
