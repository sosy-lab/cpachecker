# ----------------------------------------------------------------------
# This configuration file uses predicate-analysis to check for termination
# in non-recursive programs.
# ----------------------------------------------------------------------

#include includes/terminationToSafety-bmc.properties
#include includes/resource-limits.properties

# This is the configuration used when verifying the termination property
termination.config = terminationToSafety-bmc.properties

# Scalars in alloca memory are represented by variables, which the analysis handles better.
# This is a CFA option, so it cannot be set in the includes that nested configurations use.
cfa.replaceScalarAllocations = true
