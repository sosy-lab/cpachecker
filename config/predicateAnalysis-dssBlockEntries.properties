# Predicate analysis that abstracts only at the entries of the blocks of the DSS merge
# decomposition, e.g., to compare it with distributed summary synthesis.
#include predicateAnalysis.properties

cpa.predicate.abstractAtDssBlockEntries=true
cpa.predicate.blk.alwaysAndOnlyAtExplicitNodes=true
# Block entries are often locations inside functions that a loop calls, and every call creates a
# new callstack state. Coverage and merge have to compare the contents of callstacks, otherwise
# the loop is unrolled forever: the partitioned reached set separates states by callstack identity.
cpa.callstack.domain=FLATPCC
analysis.reachedSet=LOCATIONMAPPED

distributedSummaries.decomposition.decompositionType=MERGE_DECOMPOSITION
distributedSummaries.decomposition.largestHorizontalMerge=-1
distributedSummaries.decomposition.mergeBranchBoundaries=true

# The decomposition policy of dss.properties.
[distributedSummaries.decomposition.cpa.predicate.blk]
alwaysAtJoin=true
alwaysAtBranch=true
alwaysAtProgramExit=true
alwaysAtLoops=false
alwaysAtFunctions=false
alwaysAfterThreshold=false
alwaysAtFunctionHeads=true
alwaysAtFunctionCallNodes=false
alwaysAtFunctionExit=true
