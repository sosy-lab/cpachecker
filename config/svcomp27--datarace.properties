# ------------------------------------------------------------------------------
# Data-race analysis for SV-COMP27: the ordering-consistency analysis in parallel
# with the basic concurrency analysis with data-race detection.
# ------------------------------------------------------------------------------

specification = specification/sv-comp-datarace.spc

#include includes/resource-limits.properties

# self-reference to allow direct usage
datarace.config = svcomp27--datarace.properties

# The CFA is created once for all components, so its options are set here.
cfa.useCFACloningForMultiThreadedPrograms = true
# simplified CFA is bad for witnesses
cfa.simplifyCfa = false
# sound for this specification and useful for some analyses
cfa.removeTrivialLoops = true

# YAML witnesses configuration options
counterexample.export.yaml = witness.yml
cpa.arg.yamlProofWitness =

analysis.useParallelAnalyses = true
parallelAlgorithm.configFiles = components/svcomp27--concurrency-orderingConsistency-z3-nla.properties, \
                                components/svcomp27--datarace-threading.properties
