# ----------------------------------------------------------------------
# predk-kInduction with the base case and the induction steps in one
# exploration, as split-case k-induction does and as the paper of the PredK
# framework describes k-induction: the base case continues one iteration
# after an induction start, and the refiner increases k if a step case
# fails. predk-kInduction instead alternates between rounds for the
# base case and rounds for the step case, as native k-induction does.
# ----------------------------------------------------------------------

#include predk-kInduction.properties

cpa.induction.refinement.kInduction.combineCases = true
cpa.induction.continueBaseCase = true
cpa.induction.describedAbstractions = -1
