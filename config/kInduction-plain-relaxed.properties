// ----------------------------------------------------------------------
// Plain k-induction (no auxiliary invariant generator), with the coverage
// and merge criteria relaxed so that the state-space exploration of the
// induction step case can actually be collapsed (cf. #1694).
//
// Without the relaxation the step case does not even finish unrolling for
// k = 1 on some tasks: in BMC mode merge^JOIN is the only mechanism that can
// collapse states at all (the predicate domain covers a state only if the
// path formulas are identical), merge is only ever attempted between states
// of the same reached-set partition, and the partition key distinguishes
// practically every state, because CallstackState is compared by object
// identity by design and LoopBoundState carries the whole per-loop iteration
// vector.
//
// The step case starts from an arbitrary state at each loop head, so it may
// freely over-approximate: a coarser exploration can only make the induction
// check harder to discharge, never wrong.
//
// Note that these options apply to the whole analysis, so the base case is
// coarsened as well. Two consequences to be aware of:
//   * coverage inside a function is no longer prevented when the function was
//     entered on several paths (cf.
//     CallstackTest#testCallstackPreventsUndesiredCoverage), which the base
//     case relies on for well-formed counterexample paths;
//   * the per-loop iteration counts of a merged state are no longer
//     meaningful, so this must not be combined with candidate invariants that
//     are attached to specific program locations, which read those counts back
//     (cf. BMCHelper.filterBmcCheckedWithin).
// Both are unproblematic for the plain safety property checked here.
// ----------------------------------------------------------------------

#include kInduction-plain.properties

// Partition the reached set by location, call chain and deepest loop iteration
// instead of by every Partitionable component, so that merge^JOIN is attempted
// at all. Partitioning by location alone also enables merging, but makes every
// merge scan all states at that location, which measured worse than doing
// nothing.
analysis.reachedSet = INDUCTIONPARTITIONED

// Compare call stacks by proof state instead of by object identity, so that
// two invocations of the same function can cover each other.
cpa.callstack.domain = FLATPCC

// Compare only the deepest loop iteration instead of the whole per-loop
// iteration vector, so that states that merely visited a different set of
// loops can cover each other.
cpa.loopbound.domain = DEEPEST_ITERATION

// With the relaxation the bottleneck is no longer the state-space exploration
// but the SMT induction check, so simplify the formulas handed to the solver.
bmc.simplifyBooleanFormula = true

// Grow the loop-unrolling bound along the Fibonacci sequence (1, 2, 3, 5, 8,
// ...): faster than incrementing, but without skipping as many bounds as
// doubling does.
//
// Note that skipping bounds can make bug finding slower, because the smallest
// bound that exposes a bug may be skipped and the next one is much more
// expensive. On loops/insertion_sort-1-2.c, for example, the violation is
// found at bound 9 with INCREMENT but only at bound 13 with FIBONACCI, which
// takes 220s instead of less than 90s. Set this option to INCREMENT if finding
// violations quickly matters more than reaching a high bound.
cpa.loopbound.maxLoopIterationAdjusterFactory = FIBONACCI
