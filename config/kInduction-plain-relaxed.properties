// ----------------------------------------------------------------------
// Plain k-induction (no auxiliary invariant generator), with the coverage
// and merge criteria of the induction step case relaxed so that its
// state-space exploration can actually be collapsed (cf. #1694).
//
// Without the relaxation the step case does not even finish unrolling for
// k = 1 on some tasks: in BMC mode merge^JOIN is the only mechanism that can
// collapse states at all, merge is only attempted between states of the same
// reached-set partition, and the partition key distinguishes practically
// every state.
//
// The step case starts from an arbitrary state at each loop head, so it may
// freely over-approximate: a coarser exploration can only make the induction
// check harder to discharge, never wrong. This is sound for the plain safety
// property, but not for candidate invariants attached to specific program
// locations (BMCHelper.filterBmcCheckedWithin reads back the per-loop
// iteration counts of individual states), which is why the options below are
// off in the default configuration.
//
// Measured on product-lines/elevator_spec13_product21.cil.c, 900s of CPU
// time, --heap 10000M:
//
//   plain k-induction                      bound k = 1, 0 induction checks
//                                          (the step case never finishes
//                                           unrolling for k = 1)
//   + relaxStepCaseCoverage                bound k = 3, 2 induction checks
//   + DOUBLE bound adjustment              bound k = 4, 2 induction checks
//
// The verdict is still UNKNOWN: this removes the hang, it does not prove the
// program. With the relaxation the bottleneck is no longer the state-space
// exploration but the SMT induction check (about 500s of the 900s).
// ----------------------------------------------------------------------

#include kInduction-plain.properties

// Relax the step case only:
//   analysis.reachedSet   = INDUCTIONPARTITIONED  partition by location, call
//                                                 chain and deepest iteration
//                                                 instead of by every
//                                                 Partitionable component
//   cpa.callstack.domain  = FLATPCC               compare call stacks by proof
//                                                 state instead of by object
//                                                 identity, so that two
//                                                 invocations of the same
//                                                 function can cover each other
//   cpa.loopbound.domain  = DEEPEST_ITERATION     compare only the deepest loop
//                                                 iteration instead of the whole
//                                                 per-loop iteration vector
bmc.relaxStepCaseCoverage = true

// Double the loop-unrolling bound per round (1, 2, 4, 8, ...) instead of
// incrementing it. This reaches a higher bound within a given time budget, at
// the price of skipping the bounds in between.
cpa.loopbound.maxLoopIterationAdjusterFactory = DOUBLE
