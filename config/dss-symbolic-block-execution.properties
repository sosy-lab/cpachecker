# Symbolic execution on the block graph of distributed summary synthesis (DSS).
# Every block is summarized once by an exact path formula. Starting at the program entry, blocks
# send the strongest postcondition of the states they receive to their successors; starting at
# every block with a target location, blocks send the preimage of the violations they receive to
# their predecessors. A precondition that meets a violation condition proves the program unsafe,
# and running out of work proves it safe. There is no abstraction, so, like any symbolic execution,
# the analysis does not terminate on loops whose states never repeat.

#include includes/resource-limits.properties
#include distributed-summary-synthesis/dss-predicate-encoding.properties

specification = specification/default.spc

analysis.algorithm.symbolicBlockExecution = true
analysis.useLoopStructure = true

# The analysis of the whole program only carries the verdict.
cpa = cpa.arg.ARGCPA
ARGCPA.cpa = cpa.composite.CompositeCPA
CompositeCPA.cpas = cpa.location.LocationCPA, $specification

# Quantifier elimination and quantified coverage checks need a solver with quantifier support.
# With a solver without it, conditions are only projected.
solver.solver = Z3

# 0: a thread and a message queue per block, like DSS; n > 0: n threads with work stealing
symbolicBlockExecution.threads = 0

[distributedSummaries.decomposition]
# The conditions do not carry a calling context, so every block needs exactly one.
decompositionType = INLINING_DECOMPOSITION
largestHorizontalMerge = -1
mergeBranchBoundaries = true

[distributedSummaries.decomposition.cpa.predicate.blk]
alwaysAtJoin = true
alwaysAtBranch = true
alwaysAtProgramExit = true
alwaysAtLoops = false
alwaysAtFunctions = false
alwaysAfterThreshold = false
alwaysAtFunctionHeads = true
alwaysAtFunctionCallNodes = false
alwaysAtFunctionExit = true
