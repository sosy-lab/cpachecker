# DSS with symbolic execution in the blocks like dss-symbolic.properties, but every block replaces
# its previous analysis whenever it receives a new message.
#include dss-symbolic.properties

distributedSummaries.blockAnalysisType=ALWAYS_REPLACE
distributedSummaries.decomposition.decompositionType=INLINING_DECOMPOSITION
distributedSummaries.resetCallstackState=true
