# ----------------------------------------------------------------------
# This configuration file executes a program that has inputs: whenever
# the execution depends on an input, an SMT solver is asked for one
# assignment of the inputs and the execution continues with these
# concrete values.
# Only one of the executions of the program is explored, so this
# configuration can report FALSE but never TRUE. It is meant for
# programs that read their inputs outside of every loop, where the
# number of inputs is bounded by the program.
# ----------------------------------------------------------------------

#include includes/execution.properties
#include includes/resource-limits.properties

# The values of the inputs are symbolic and the ConstraintsCPA collects the
# constraints that the execution imposes on them, which is what the SMT solver
# then gets asked for an assignment.
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.value.ValueAnalysisCPA, cpa.constraints.ConstraintsCPA, $specification
cpa.value.unknownValueHandling = INTRODUCE_SYMBOLIC

cpa.execution.sampleNondeterministicValues = true

specification = specification/default.spc
