# ----------------------------------------------------------------------
# This configuration checks termination like terminationToSafety.properties,
# but uses the invariants of the abstract states at the loop heads,
# e.g., intervals of the InvariantsCPA, as supporting invariants
# for the transition invariants.
# ----------------------------------------------------------------------

#include includes/terminationToSafety.properties
#include includes/resource-limits.properties

termination.config = terminationToSafety-invariants.properties

# The InvariantsCPA is last, such that the composite merge widens its state
# only if the other states are covered.
CompositeCPA.cpas = cpa.location.LocationCPA, \
                    cpa.predicate.PredicateCPA, \
                    cpa.value.ValueAnalysisCPA, \
                    cpa.callstack.CallstackCPA, \
                    cpa.terminationviamemory.TerminationToReachCPA, \
                    cpa.invariants.InvariantsCPA

cpa.terminationviamemory.useInvariantsFromAbstractStates = true

# The termination property has no target locations
cpa.invariants.analyzeTargetPathsOnly = false
cpa.invariants.analyzeRelevantVariablesOnly = false
