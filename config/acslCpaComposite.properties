#include predicateAnalysis.properties

solver.solver=Z3
cpa.predicate.refinement.useNewtonRefinement=true

cpa.predicate.injectAcslInvariants=true
cpa.acsl.invariants.arrayInit=true
cpa.acsl.invariants.arrayCopy=true


cpa = cpa.arg.ARGCPA
ARGCPA.cpa = cpa.composite.CompositeCPA

CompositeCPA.cpas = cpa.location.LocationCPA, \
                    cpa.predicate.PredicateCPA, \
                    cpa.acsl.AcslCPA
