# ----------------------------------------------------------------------
# Parallel portfolio for SV-LIB programs:
# predicate analysis without its own time limit and BMC for 210 s.
# ----------------------------------------------------------------------

#include includes/svlib.properties
#include includes/resource-limits.properties

specification = specification/correct-annotations.spc

# Set witness options
counterexample.export.svlib = witness.svlib
cpa.arg.svLibCorrectnessWitness = witness.svlib

analysis.useParallelAnalyses = true
parallelAlgorithm.configFiles = components/svcomp27--svlib-predicateAnalysis.properties, \
                                components/svcomp27--svlib-bmc.properties
