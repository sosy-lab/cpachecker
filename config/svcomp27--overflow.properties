# ------------------------------------------------------------------------------
# This configuration file uses sets of intervals to check the overflow property
# for SV-COMP27.
# ------------------------------------------------------------------------------

#include includes/resource-limits.properties

specification = specification/sv-comp-overflow.spc

# CFA simplifications might remove overflows:
cfa.simplifyCfa = false
cfa.simplifyConstExpressions = false

# sound for this specification and useful for some analyses
cfa.removeTrivialLoops = true

# Expressions without live variables can contain overflows, e.g. if they contain literals!
cfa.findLiveVariables = false
overflow.useLiveness = false

cpa.arg.yamlProofWitness = witness.yml
counterexample.export.yaml = witness.yml

# The analyses run next to two cheap analyses that decide the easy tasks within seconds.
# The parallel algorithm reports the first conclusive result and an UNKNOWN of the simple
# checks does not stop the portfolio.
analysis.useParallelAnalyses = true

parallelAlgorithm.configFiles = components/svcomp27--simpleChecks-overflow.properties, \
                                components/svcomp27--sequential-overflow.properties

# self-reference to allow direct usage
overflow.config = svcomp27--overflow.properties

cfa.useCFACloningForMultiThreadedPrograms=true
