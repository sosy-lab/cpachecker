# ----------------------------------------------------------------------
# Predicate analysis as an instance of the PredK framework:
# the InductionCPA abstracts at every visit of a loop head and never
# starts an induction step, and the refiner is the one of predicate
# analysis. The results are the ones of predicateAnalysis.
# ----------------------------------------------------------------------

#include predicateAnalysis.properties

CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA, cpa.induction.InductionCPA, $specification
