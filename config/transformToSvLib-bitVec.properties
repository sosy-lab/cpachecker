analysis.algorithm.transformToSvLib = true
analysis.algorithm.toSvLib.runAnalysis = true
analysis.algorithm.toSvLib.svLibAnalysisConfiguration = predicateAnalysis-svlib.properties
analysis.algorithm.toSvLib.svLibAnalysisSpecification = ../config/specification/correct-annotations.spc

specification = specification/default.spc

# The transformation and the analysis of the transformed script run in the same JVM and share
# this solver: two different native solver libraries interfere with each other, because Z3 and
# MATHSAT5 for example both bundle GMP, so the one that is loaded second silently stops being
# able to create numerals. MATHSAT5 is used because it performs best for the verification.
solver.solver = MATHSAT5

# do not ignore variables that are irrelevant to reachability properties
cpa.predicate.ignoreIrrelevantVariables = false
cpa.predicate.useConstraintOptimization = false
cpa.predicate.encodeBitvectorAs = BITVECTOR

# encode the functions memset, memcopy and memmove instead of aborting the transformation on them
cpa.predicate.enableMemoryAssignmentFunctions = true
