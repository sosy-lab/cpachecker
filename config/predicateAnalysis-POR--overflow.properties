# Overflow analysis for concurrent programs: predicateAnalysis-POR.properties with the
# OverflowCPA and the no-overflow specification.

#include predicateAnalysis-POR.properties
#include includes/overflow.properties

specification = specification/overflow.spc
overflow.config = predicateAnalysis-POR--overflow.properties
CompositeCPA.cpas = cpa.mutex.MutexCPA, cpa.predicate.PredicateCPA, cpa.overflow.OverflowCPA
