# ----------------------------------------------------------------------
# This configuration file uses predicate analysis with ABE for
# abstractions at loop heads, combined with the PredicateDelegatingRefiner,
# which monitors refinement progress via heuristics and terminates
# CEGAR early if all heuristics indicate divergence.
# ----------------------------------------------------------------------

#include includes/predicateAnalysis-PredAbsRefiner-ABEl.properties

#include includes/resource-limits.properties

specification = specification/default.spc

analysis.reachedSet.trackChanges = true

cpa.predicate.refinement.usePredicateDelegatingRefiner = true

cpa.predicate.refinement.delegatingRefinerHeuristics.heuristicRefinerPairs=RUNREFINERNTIMES:STATIC,REACHED_SET_RATIO:DEFAULT,INTERPOLATION_RATE:DEFAULT,REDUNDANT_PREDICATES_PLATEAU:DEFAULT,STOP:STOP

cpa.predicate.delegatingRefinerHeuristics.RunRefinerNTimes.numberRuns=2

cpa.predicate.delegatingRefinerHeuristics.InterpolationRate.acceptableInterpolantRate=8.0

cpa.predicate.delegatingRefinerHeuristics.ReachedSetRatio.abstractionLocationRefinementRatio=3.0

cpa.predicate.delegatingRefinerHeuristics.ReachedSetRatio.refinementThreshold=10

cpa.predicate.delegatingRefinerHeuristics.ReachedSetRatio.abstractionLocationThreshold=3

cegar.refiner=cpa.predicate.PredicateDelegatingRefiner



