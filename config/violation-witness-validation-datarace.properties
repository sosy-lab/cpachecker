# ------------------------------------------------------------------------------
# This configuration file extends a basic concurrency analysis with
# functionality to detect data races.
# ------------------------------------------------------------------------------

specification =  specification/datarace.spc

#include includes/concurrency.properties
#include includes/resource-limits.properties
#include includes/witness-validation.properties

analysis.traversal.order = bfs

CompositeCPA.cpas = cpa.threading.ThreadingCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA, cpa.value.ValueAnalysisCPA, cpa.datarace.DataRaceCPA

# The DataRaceCPA assumes that accesses through pointers alias or not,
# refinement rules out data races under infeasible assumptions.
# The FunctionPointerCPA removes infeasible calls through function pointers before refinement.
analysis.algorithm.CEGAR = true
cegar.refiner = cpa.predicate.PredicateRefiner
# The assumptions refer to variables and fields that are irrelevant for the CFA alone.
cpa.predicate.ignoreIrrelevantVariables = false
cpa.predicate.ignoreIrrelevantFields = false

cpa.threading.allowMultipleLHS = true

cpa.callstack.unsupportedFunctions =  scanf

# Local-access locks reorder local steps of a thread, but witness waypoints also match local
# steps, so valid witnesses can be rejected. To enable the locks again, an edge that any
# transition of the witness automaton may match (see AutomatonTransition#nontriviallyMatches)
# must release the lock of its thread like a global edge, e.g., in ThreadingTransferRelation#strengthen.
cpa.threading.useLocalAccessLocks = false
