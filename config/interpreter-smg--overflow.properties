# ----------------------------------------------------------------------
# Like interpreter--overflow.properties, but with the SMG analysis,
# which is precise for programs that access memory through pointers.
# It uses the SMG2 options of symbolic execution and lets allocations
# fail, cf. includes/interpreter-smgSymEx.properties.
# It is applicable only to programs without nondeterministic choices.
# ----------------------------------------------------------------------

#include includes/interpreter-smgSymEx.properties
#include includes/overflow.properties
#include includes/resource-limits.properties

# The OverflowCPA adds the assumptions that describe an overflow, which the
# SMG analysis then evaluates for the values of the execution.
CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.smg2.SMGCPA, cpa.overflow.OverflowCPA, $specification

specification = specification/overflow.spc

# self-reference to allow direct usage
overflow.config = interpreter-smg--overflow.properties
