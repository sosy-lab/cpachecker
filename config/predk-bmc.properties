# ----------------------------------------------------------------------
# BMC as an instance of the PredK framework: the precision describes no
# abstraction, so the exploration unrolls the loops k times and cuts the
# paths off at the next visit of a loop head. The refiner runs the queries
# of native BMC (targets, bounding assertions) and increments k, starting
# at 1, while a cut-off is reachable.
# Compare with bmc-incremental.
# ----------------------------------------------------------------------

#include includes/predk-framework.properties

cegar.refiner = cpa.induction.refiner.BmcRefiner

CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.functionpointer.FunctionPointerCPA, cpa.predicate.PredicateCPA, cpa.induction.InductionCPA, cpa.value.ValueAnalysisCPA, $specification
cpa.value.merge = JOIN

cpa.induction.k = 1
cpa.induction.describedAbstractions = 0
cpa.automaton.breakOnTargetState = 0

# exploration as in native BMC
cpa.predicate.blk.alwaysAtLoops = false
analysis.traversal.useReverseLoopIterationCount = true
cpa.arg.lateMerge = prevent
cfa.removeTrivialLoops = true

specification = specification/default.spc

#include includes/resource-limits.properties
